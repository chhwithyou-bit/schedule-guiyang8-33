<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中国象棋 · 双人对战</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #1a0e05;
  --board: #d4a85a;
  --board2: #c8993f;
  --board-dark: #b8832a;
  --line: #7a4a10;
  --red-piece: #c0392b;
  --red-piece2: #e74c3c;
  --red-piece-dark: #922b21;
  --black-piece: #1a1a1a;
  --black-piece2: #2c2c2c;
  --black-piece-dark: #0a0a0a;
  --selected: #f1c40f;
  --valid-move: rgba(46, 213, 115, 0.7);
  --text-red: #fff5e6;
  --text-black: #f0e6d0;
  --gold: #d4a017;
  --gold2: #f0c040;
  --shadow: rgba(0,0,0,0.6);
  --ui-bg: rgba(20,10,0,0.92);
  --border-gold: rgba(212,160,23,0.5);
}

html, body {
  background: var(--bg);
  color: #f0e6d0;
  font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
  height: 100%;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(180,100,20,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(150,60,10,0.1) 0%, transparent 60%),
    repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,200,100,0.015) 40px, rgba(255,200,100,0.015) 80px);
  z-index: 0;
  pointer-events: none;
}

#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  align-items: center;
}

/* ===== HEADER ===== */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 16px 6px;
  background: linear-gradient(180deg, rgba(30,15,0,0.95) 0%, rgba(20,10,0,0.8) 100%);
  border-bottom: 1px solid var(--border-gold);
  flex-shrink: 0;
}

.title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #d4a017, #f0c040, #d4a017);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}

.header-btns {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--border-gold);
  background: rgba(212,160,23,0.12);
  color: var(--gold2);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.btn:hover { background: rgba(212,160,23,0.25); }
.btn:active { transform: scale(0.95); }

/* ===== PLAYER PANELS ===== */
#players {
  display: flex;
  width: 100%;
  padding: 8px 16px;
  gap: 8px;
  flex-shrink: 0;
}

.player-card {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.04);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.player-card.active {
  border-color: var(--border-gold);
  background: rgba(212,160,23,0.1);
  box-shadow: 0 0 20px rgba(212,160,23,0.15);
}

.player-card.active::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold2), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0%,100% { opacity: 0.4; } 50% { opacity: 1; }
}

.player-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.player-icon.red {
  background: radial-gradient(circle at 35% 35%, #e74c3c, #922b21);
  color: #fff5e6;
  border: 2px solid rgba(231,76,60,0.5);
}

.player-icon.black {
  background: radial-gradient(circle at 35% 35%, #555, #111);
  color: #f0e6d0;
  border: 2px solid rgba(200,180,150,0.3);
}

.player-info { flex: 1; }
.player-name { font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #f0e6d0; }
.player-status { font-size: 11px; color: rgba(240,230,208,0.5); letter-spacing: 1px; margin-top: 2px; }
.player-card.active .player-status { color: var(--gold2); }

.turn-indicator {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 1px;
}
.turn-indicator.active {
  background: rgba(212,160,23,0.2);
  color: var(--gold2);
  border: 1px solid rgba(212,160,23,0.4);
}

/* ===== BOARD AREA ===== */
#board-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  min-height: 0;
}

#board-container {
  position: relative;
}

canvas {
  display: block;
  border-radius: 4px;
  box-shadow: 
    0 0 0 3px #8b5e1a,
    0 0 0 6px #5a3a0a,
    0 0 40px rgba(0,0,0,0.8),
    inset 0 0 30px rgba(0,0,0,0.2);
  cursor: pointer;
  touch-action: none;
}

/* ===== STATUS BAR ===== */
#status-bar {
  width: 100%;
  padding: 8px 16px;
  flex-shrink: 0;
  background: linear-gradient(0deg, rgba(30,15,0,0.95) 0%, rgba(20,10,0,0.8) 100%);
  border-top: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: center;
}

#status-msg {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold2);
  text-align: center;
  font-weight: 600;
  min-height: 20px;
}

/* ===== OVERLAY ===== */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
#overlay.show { opacity: 1; pointer-events: all; }

.modal {
  background: linear-gradient(160deg, #1e1005, #0d0800);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 36px 40px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  box-shadow: 0 0 60px rgba(212,160,23,0.2);
  transform: scale(0.9);
  transition: transform 0.4s;
}
#overlay.show .modal { transform: scale(1); }

.modal-icon { font-size: 52px; margin-bottom: 16px; }
.modal-title {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #d4a017, #f0c040);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.modal-subtitle {
  font-size: 14px;
  color: rgba(240,230,208,0.6);
  letter-spacing: 2px;
  margin-bottom: 28px;
}
.modal-btns { display: flex; gap: 12px; justify-content: center; }
.modal-btn {
  padding: 10px 28px;
  border-radius: 6px;
  border: 1px solid var(--border-gold);
  background: rgba(212,160,23,0.15);
  color: var(--gold2);
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.modal-btn:hover { background: rgba(212,160,23,0.3); transform: translateY(-1px); }
.modal-btn.primary {
  background: linear-gradient(135deg, rgba(212,160,23,0.3), rgba(240,192,64,0.2));
  border-color: var(--gold2);
}

/* Check alert */
#check-alert {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(192,57,43,0.95);
  color: white;
  padding: 14px 32px;
  border-radius: 8px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 4px;
  z-index: 50;
  pointer-events: none;
  border: 2px solid rgba(255,100,80,0.6);
  box-shadow: 0 0 30px rgba(192,57,43,0.5);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
}
#check-alert.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="title">中国象棋</div>
    <div class="header-btns">
      <button class="btn" onclick="game.newGame()">重新开局</button>
      <button class="btn" onclick="game.undoMove()">悔棋</button>
    </div>
  </div>

  <div id="players">
    <div class="player-card" id="card-black">
      <div class="player-icon black">将</div>
      <div class="player-info">
        <div class="player-name">黑方</div>
        <div class="player-status" id="status-black">等待中</div>
      </div>
      <div class="turn-indicator" id="ind-black"></div>
    </div>
    <div class="player-card active" id="card-red">
      <div class="player-icon red">帅</div>
      <div class="player-info">
        <div class="player-name">红方</div>
        <div class="player-status" id="status-red">行棋中</div>
      </div>
      <div class="turn-indicator active" id="ind-red">行棋</div>
    </div>
  </div>

  <div id="board-wrap">
    <div id="board-container">
      <canvas id="chessCanvas"></canvas>
    </div>
  </div>

  <div id="status-bar">
    <div id="status-msg">红方先行，请落子</div>
  </div>
</div>

<div id="overlay">
  <div class="modal">
    <div class="modal-icon" id="modal-icon">🏆</div>
    <div class="modal-title" id="modal-title">红方胜利</div>
    <div class="modal-subtitle" id="modal-sub">将军！游戏结束</div>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="game.newGame()">再战一局</button>
    </div>
  </div>
</div>

<div id="check-alert">将军！</div>

<script>
// ============================================================
// CHINESE CHESS ENGINE
// ============================================================

const PIECES = {
  // Red pieces (positive numbers)
  R_KING:   1,  // 帅
  R_GUARD:  2,  // 仕
  R_BISHOP: 3,  // 相
  R_KNIGHT: 4,  // 马
  R_ROOK:   5,  // 车
  R_CANNON: 6,  // 炮
  R_PAWN:   7,  // 兵
  // Black pieces (negative numbers)
  B_KING:  -1,  // 将
  B_GUARD: -2,  // 士
  B_BISHOP:-3,  // 象
  B_KNIGHT:-4,  // 马
  B_ROOK:  -5,  // 车
  B_CANNON:-6,  // 炮
  B_PAWN:  -7,  // 卒
};

const PIECE_NAMES = {
  1: '帅', 2: '仕', 3: '相', 4: '马', 5: '车', 6: '炮', 7: '兵',
  '-1': '将', '-2': '士', '-3': '象', '-4': '马', '-5': '车', '-6': '炮', '-7': '卒'
};

// Initial board setup (10 rows, 9 cols)
// Row 0 = black side top, Row 9 = red side bottom
function createInitialBoard() {
  const b = Array(10).fill(null).map(() => Array(9).fill(0));
  // Black pieces (top)
  b[0][0] = PIECES.B_ROOK;   b[0][8] = PIECES.B_ROOK;
  b[0][1] = PIECES.B_KNIGHT; b[0][7] = PIECES.B_KNIGHT;
  b[0][2] = PIECES.B_BISHOP; b[0][6] = PIECES.B_BISHOP;
  b[0][3] = PIECES.B_GUARD;  b[0][5] = PIECES.B_GUARD;
  b[0][4] = PIECES.B_KING;
  b[2][1] = PIECES.B_CANNON; b[2][7] = PIECES.B_CANNON;
  b[3][0] = PIECES.B_PAWN;   b[3][2] = PIECES.B_PAWN;
  b[3][4] = PIECES.B_PAWN;   b[3][6] = PIECES.B_PAWN;
  b[3][8] = PIECES.B_PAWN;
  // Red pieces (bottom)
  b[9][0] = PIECES.R_ROOK;   b[9][8] = PIECES.R_ROOK;
  b[9][1] = PIECES.R_KNIGHT; b[9][7] = PIECES.R_KNIGHT;
  b[9][2] = PIECES.R_BISHOP; b[9][6] = PIECES.R_BISHOP;
  b[9][3] = PIECES.R_GUARD;  b[9][5] = PIECES.R_GUARD;
  b[9][4] = PIECES.R_KING;
  b[7][1] = PIECES.R_CANNON; b[7][7] = PIECES.R_CANNON;
  b[6][0] = PIECES.R_PAWN;   b[6][2] = PIECES.R_PAWN;
  b[6][4] = PIECES.R_PAWN;   b[6][6] = PIECES.R_PAWN;
  b[6][8] = PIECES.R_PAWN;
  return b;
}

// ============================================================
// MOVE GENERATION
// ============================================================

function isRed(p) { return p > 0; }
function isBlack(p) { return p < 0; }
function isEnemy(p1, p2) { return (p1 > 0 && p2 < 0) || (p1 < 0 && p2 > 0); }
function inBounds(r, c) { return r >= 0 && r <= 9 && c >= 0 && c <= 8; }

function getMoves(board, row, col, ignoreCheck) {
  const piece = board[row][col];
  if (!piece) return [];
  const moves = [];
  const red = isRed(piece);
  const type = Math.abs(piece);

  function addMove(r, c) {
    if (!inBounds(r, c)) return false;
    const target = board[r][c];
    if (target && ((red && isRed(target)) || (!red && isBlack(target)))) return false;
    moves.push([r, c]);
    return true;
  }

  switch(type) {
    case 1: // King (帅/将)
      { const palace = red ? { r1:7, r2:9, c1:3, c2:5 } : { r1:0, r2:2, c1:3, c2:5 };
        for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nr = row+dr, nc = col+dc;
          if (nr>=palace.r1 && nr<=palace.r2 && nc>=palace.c1 && nc<=palace.c2) addMove(nr,nc);
        }
        // Flying general check
        let oppositeKingRow = -1;
        const dir = red ? -1 : 1;
        for (let r2 = row+dir; inBounds(r2,col); r2+=dir) {
          if (board[r2][col] !== 0) {
            const enemyKing = red ? PIECES.B_KING : PIECES.R_KING;
            if (board[r2][col] === enemyKing) moves.push([r2, col]);
            break;
          }
        }
      }
      break;

    case 2: // Guard (仕/士)
      { const palace = red ? { r1:7, r2:9, c1:3, c2:5 } : { r1:0, r2:2, c1:3, c2:5 };
        for (const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
          const nr = row+dr, nc = col+dc;
          if (nr>=palace.r1 && nr<=palace.r2 && nc>=palace.c1 && nc<=palace.c2) addMove(nr,nc);
        }
      }
      break;

    case 3: // Bishop (相/象)
      for (const [dr,dc] of [[-2,-2],[-2,2],[2,-2],[2,2]]) {
        const nr = row+dr, nc = col+dc;
        // Can't cross river
        if (red && nr < 5) continue;
        if (!red && nr > 4) continue;
        // Check blocking point
        if (board[row+dr/2][col+dc/2]) continue;
        addMove(nr, nc);
      }
      break;

    case 4: // Knight (马)
      for (const [dr,dc,br,bc] of [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[-1,2,0,1],[1,-2,0,-1],[1,2,0,1]]) {
        const nr = row+dr, nc = col+dc;
        // Check leg blocking
        if (board[row+br][col+bc]) continue;
        addMove(nr, nc);
      }
      break;

    case 5: // Rook (车)
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let nr = row+dr, nc = col+dc;
        while (inBounds(nr, nc)) {
          if (board[nr][nc]) {
            if (isEnemy(piece, board[nr][nc])) moves.push([nr,nc]);
            break;
          }
          moves.push([nr,nc]);
          nr += dr; nc += dc;
        }
      }
      break;

    case 6: // Cannon (炮)
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let nr = row+dr, nc = col+dc;
        let jumped = false;
        while (inBounds(nr, nc)) {
          if (!jumped) {
            if (board[nr][nc]) jumped = true;
            else moves.push([nr,nc]);
          } else {
            if (board[nr][nc]) {
              if (isEnemy(piece, board[nr][nc])) moves.push([nr,nc]);
              break;
            }
          }
          nr += dr; nc += dc;
        }
      }
      break;

    case 7: // Pawn (兵/卒)
      if (red) {
        // Red moves up (decreasing row)
        addMove(row-1, col);
        if (row <= 4) { // Crossed river
          addMove(row, col-1);
          addMove(row, col+1);
        }
      } else {
        // Black moves down (increasing row)
        addMove(row+1, col);
        if (row >= 5) { // Crossed river
          addMove(row, col-1);
          addMove(row, col+1);
        }
      }
      break;
  }

  if (ignoreCheck) return moves;

  // Filter moves that leave king in check
  return moves.filter(([nr, nc]) => {
    const newBoard = boardClone(board);
    newBoard[nr][nc] = piece;
    newBoard[row][col] = 0;
    return !isInCheck(newBoard, red);
  });
}

function isInCheck(board, redTurn) {
  // Find king
  const king = redTurn ? PIECES.R_KING : PIECES.B_KING;
  let kr = -1, kc = -1;
  for (let r = 0; r < 10; r++)
    for (let c = 0; c < 9; c++)
      if (board[r][c] === king) { kr = r; kc = c; }

  if (kr === -1) return true; // King captured

  // Check if any enemy piece can attack king
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (!p) continue;
      if (redTurn && !isBlack(p)) continue;
      if (!redTurn && !isRed(p)) continue;
      const enemyMoves = getMoves(board, r, c, true);
      if (enemyMoves.some(([mr,mc]) => mr === kr && mc === kc)) return true;
    }
  }
  return false;
}

function isCheckmate(board, redTurn) {
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (!p) continue;
      if (redTurn && !isRed(p)) continue;
      if (!redTurn && !isBlack(p)) continue;
      if (getMoves(board, r, c, false).length > 0) return false;
    }
  }
  return true;
}

function boardClone(board) {
  return board.map(row => [...row]);
}

// ============================================================
// RENDERER
// ============================================================

class ChessRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
  }

  resize() {
    const wrap = document.getElementById('board-wrap');
    const ww = wrap.clientWidth - 12;
    const wh = wrap.clientHeight - 12;
    
    // Safety check: if container has no size yet, use window dimensions
    if (ww <= 0 || wh <= 0) {
      const cellSize = Math.min(40, window.innerWidth / 11, window.innerHeight / 13);
      this.cell = cellSize;
      this.pad = Math.round(cellSize * 0.65);
      this.pieceR = Math.round(cellSize * 0.42);
      this.bw = cellSize * 8 + this.pad * 2;
      this.bh = cellSize * 9 + this.pad * 2;
    } else {
      // Board ratio: 9 cols, 10 rows + padding
      const padRatio = 0.08;
      const cellSize = Math.min(
        Math.floor(ww / (9 + padRatio * 2)),
        Math.floor(wh / (10 + padRatio * 2))
      );
      this.cell = cellSize;
      this.pad = Math.round(cellSize * 0.65);
      this.pieceR = Math.round(cellSize * 0.42);
      this.bw = cellSize * 8 + this.pad * 2;
      this.bh = cellSize * 9 + this.pad * 2;
    }
    
    this.canvas.width = this.bw;
    this.canvas.height = this.bh;
    this.canvas.style.width = this.bw + 'px';
    this.canvas.style.height = this.bh + 'px';
  }

  cellToXY(row, col) {
    return {
      x: this.pad + col * this.cell,
      y: this.pad + row * this.cell
    };
  }

  xyToCell(x, y) {
    const col = Math.round((x - this.pad) / this.cell);
    const row = Math.round((y - this.pad) / this.cell);
    if (row < 0 || row > 9 || col < 0 || col > 8) return null;
    return { row, col };
  }

  drawBoard() {
    const ctx = this.ctx;
    const { bw, bh, cell, pad } = this;

    // Board background
    const grad = ctx.createLinearGradient(0, 0, bw, bh);
    grad.addColorStop(0, '#d4a85a');
    grad.addColorStop(0.5, '#c8993f');
    grad.addColorStop(1, '#b8832a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, bw, bh);

    // Wood grain texture (subtle lines)
    ctx.strokeStyle = 'rgba(160,100,30,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < bh; i += 3) {
      ctx.beginPath();
      ctx.moveTo(0, i + Math.sin(i*0.1)*2);
      ctx.lineTo(bw, i + Math.sin(i*0.1)*2);
      ctx.stroke();
    }

    // Grid lines
    ctx.strokeStyle = '#6b3e0f';
    ctx.lineWidth = 1;

    // Draw horizontal lines
    for (let r = 0; r <= 9; r++) {
      const y = pad + r * cell;
      ctx.beginPath();
      ctx.moveTo(pad, y);
      ctx.lineTo(pad + 8 * cell, y);
      ctx.stroke();
    }

    // Draw vertical lines (with river break)
    for (let c = 0; c <= 8; c++) {
      const x = pad + c * cell;
      // Top half (rows 0-4)
      ctx.beginPath();
      ctx.moveTo(x, pad);
      ctx.lineTo(x, pad + 4 * cell);
      ctx.stroke();
      // Bottom half (rows 5-9)
      ctx.beginPath();
      ctx.moveTo(x, pad + 5 * cell);
      ctx.lineTo(x, pad + 9 * cell);
      ctx.stroke();
    }

    // Palace diagonals
    ctx.strokeStyle = '#6b3e0f';
    ctx.lineWidth = 1;
    // Black palace (top)
    ctx.beginPath();
    ctx.moveTo(pad + 3*cell, pad);
    ctx.lineTo(pad + 5*cell, pad + 2*cell);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pad + 5*cell, pad);
    ctx.lineTo(pad + 3*cell, pad + 2*cell);
    ctx.stroke();
    // Red palace (bottom)
    ctx.beginPath();
    ctx.moveTo(pad + 3*cell, pad + 7*cell);
    ctx.lineTo(pad + 5*cell, pad + 9*cell);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pad + 5*cell, pad + 7*cell);
    ctx.lineTo(pad + 3*cell, pad + 9*cell);
    ctx.stroke();

    // River text
    ctx.save();
    ctx.font = `bold ${Math.round(cell * 0.38)}px 'Noto Serif SC', serif`;
    ctx.fillStyle = 'rgba(100,55,10,0.5)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const riverY = pad + 4.5 * cell;
    ctx.fillText('楚 河', pad + 2 * cell, riverY);
    ctx.fillText('汉 界', pad + 6 * cell, riverY);
    ctx.restore();

    // Cannon & pawn position markers
    const markerPositions = [
      [2,1],[2,7],[7,1],[7,7], // cannons
      [3,0],[3,2],[3,4],[3,6],[3,8], // black pawns
      [6,0],[6,2],[6,4],[6,6],[6,8], // red pawns
    ];
    for (const [r,c] of markerPositions) {
      this.drawPositionMarker(r, c);
    }
  }

  drawPositionMarker(row, col) {
    const ctx = this.ctx;
    const { pad, cell } = this;
    const x = pad + col * cell;
    const y = pad + row * cell;
    const s = Math.round(cell * 0.1);
    ctx.strokeStyle = '#6b3e0f';
    ctx.lineWidth = 1;

    const corners = [];
    if (col > 0) corners.push([-1, -1], [-1, 1]);
    if (col < 8) corners.push([1, -1], [1, 1]);
    if (col === 0) corners.push([1, -1], [1, 1]);
    if (col === 8) corners.push([-1, -1], [-1, 1]);

    const allCorners = [];
    if (col > 0 && row > 0) allCorners.push([-1, -1]);
    if (col < 8 && row > 0) allCorners.push([1, -1]);
    if (col > 0 && row < 9) allCorners.push([-1, 1]);
    if (col < 8 && row < 9) allCorners.push([1, 1]);

    for (const [cx, cy] of allCorners) {
      ctx.beginPath();
      ctx.moveTo(x + cx * s * 0.5, y + cy * s * 2.5);
      ctx.lineTo(x + cx * s * 0.5, y + cy * s * 0.5);
      ctx.lineTo(x + cx * s * 2.5, y + cy * s * 0.5);
      ctx.stroke();
    }
  }

  drawPiece(row, col, piece, selected, validMove, lastMove) {
    const ctx = this.ctx;
    const { pad, cell, pieceR } = this;
    const { x, y } = this.cellToXY(row, col);
    const red = isRed(piece);
    const name = PIECE_NAMES[piece];

    // Valid move indicator
    if (validMove) {
      ctx.beginPath();
      ctx.arc(x, y, pieceR * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(46, 213, 115, 0.75)';
      ctx.fill();
      if (piece) {
        // Capture indicator ring
        ctx.beginPath();
        ctx.arc(x, y, pieceR + 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(46, 213, 115, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        return;
      }
    }

    // Last move highlight
    if (lastMove) {
      ctx.beginPath();
      ctx.arc(x, y, pieceR + 4, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 230, 0, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Selected ring
    if (selected) {
      ctx.beginPath();
      ctx.arc(x, y, pieceR + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(241, 196, 15, 0.9)';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Pulsing glow
      ctx.beginPath();
      ctx.arc(x, y, pieceR + 8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(241, 196, 15, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Shadow
    ctx.beginPath();
    ctx.arc(x + 2, y + 3, pieceR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fill();

    // Piece body gradient
    const grad = ctx.createRadialGradient(x - pieceR*0.3, y - pieceR*0.3, pieceR*0.1, x, y, pieceR);
    if (red) {
      grad.addColorStop(0, '#f47b6e');
      grad.addColorStop(0.4, '#c0392b');
      grad.addColorStop(1, '#7b241c');
    } else {
      grad.addColorStop(0, '#666');
      grad.addColorStop(0.4, '#222');
      grad.addColorStop(1, '#050505');
    }

    ctx.beginPath();
    ctx.arc(x, y, pieceR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Inner ring
    ctx.beginPath();
    ctx.arc(x, y, pieceR * 0.85, 0, Math.PI * 2);
    ctx.strokeStyle = red ? 'rgba(255,200,180,0.5)' : 'rgba(200,180,140,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Outer ring
    ctx.beginPath();
    ctx.arc(x, y, pieceR, 0, Math.PI * 2);
    ctx.strokeStyle = red ? 'rgba(200,100,80,0.8)' : 'rgba(100,80,60,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Sheen
    const sheen = ctx.createRadialGradient(x - pieceR*0.3, y - pieceR*0.4, 0, x - pieceR*0.2, y - pieceR*0.3, pieceR*0.6);
    sheen.addColorStop(0, 'rgba(255,255,255,0.3)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(x, y, pieceR, 0, Math.PI * 2);
    ctx.fillStyle = sheen;
    ctx.fill();

    // Piece text
    ctx.save();
    const fontSize = Math.round(pieceR * 1.1);
    ctx.font = `900 ${fontSize}px 'Noto Serif SC', 'STSong', serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = red ? '#ffe8d6' : '#f0e6c8';
    ctx.shadowColor = red ? 'rgba(100,20,10,0.8)' : 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 2;
    ctx.fillText(name, x, y + 1);
    ctx.restore();
  }

  render(board, selected, validMoves, lastFrom, lastTo) {
    this.drawBoard();

    // Draw valid move empty squares first
    const validSet = new Set(validMoves.map(([r,c]) => `${r},${c}`));
    for (const [r, c] of validMoves) {
      if (!board[r][c]) {
        const { x, y } = this.cellToXY(r, c);
        this.ctx.beginPath();
        this.ctx.arc(x, y, this.pieceR * 0.3, 0, Math.PI * 2);
        this.ctx.fillStyle = 'rgba(46, 213, 115, 0.7)';
        this.ctx.fill();
      }
    }

    // Draw pieces
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        const p = board[r][c];
        if (!p) continue;
        const sel = selected && selected[0] === r && selected[1] === c;
        const vm = validSet.has(`${r},${c}`);
        const lm = (lastFrom && lastFrom[0]===r && lastFrom[1]===c) ||
                   (lastTo && lastTo[0]===r && lastTo[1]===c);
        this.drawPiece(r, c, p, sel, vm, lm);
      }
    }
  }
}

// ============================================================
// GAME CONTROLLER
// ============================================================

class ChessGame {
  constructor() {
    this.canvas = document.getElementById('chessCanvas');
    this.renderer = new ChessRenderer(this.canvas);
    this.board = createInitialBoard();
    this.redTurn = true;
    this.selected = null;
    this.validMoves = [];
    this.history = [];
    this.lastFrom = null;
    this.lastTo = null;
    this.gameOver = false;

    this.canvas.addEventListener('click', e => this.handleClick(e));
    this.canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      this.handleInput(
        (t.clientX - rect.left) * scaleX,
        (t.clientY - rect.top) * scaleY
      );
    }, { passive: false });

    window.addEventListener('resize', () => {
      this.renderer.resize();
      this.render();
    });

    // Wait for DOM layout to complete before rendering
    if (document.readyState === 'loading') {
      window.addEventListener('load', () => {
        this.renderer.resize();
        this.render();
        this.updateUI();
      });
    } else {
      // If document is already loaded, use requestAnimationFrame to ensure layout is complete
      requestAnimationFrame(() => {
        this.renderer.resize();
        this.render();
        this.updateUI();
      });
    }
  }

  handleClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    this.handleInput(
      (e.clientX - rect.left) * scaleX,
      (e.clientY - rect.top) * scaleY
    );
  }

  handleInput(x, y) {
    if (this.gameOver) return;
    const cell = this.renderer.xyToCell(x, y);
    if (!cell) return;
    const { row, col } = cell;
    const piece = this.board[row][col];

    if (this.selected) {
      const [sr, sc] = this.selected;
      const isValid = this.validMoves.some(([r,c]) => r===row && c===col);

      if (isValid) {
        // Execute move
        this.executeMove(sr, sc, row, col);
        return;
      }

      // Click own piece - reselect
      if (piece && ((this.redTurn && isRed(piece)) || (!this.redTurn && isBlack(piece)))) {
        this.selected = [row, col];
        this.validMoves = getMoves(this.board, row, col, false);
        this.render();
        return;
      }

      // Deselect
      this.selected = null;
      this.validMoves = [];
      this.render();
      return;
    }

    // Select piece
    if (piece && ((this.redTurn && isRed(piece)) || (!this.redTurn && isBlack(piece)))) {
      this.selected = [row, col];
      this.validMoves = getMoves(this.board, row, col, false);
      this.render();
    }
  }

  executeMove(fr, fc, tr, tc) {
    // Save history
    this.history.push({
      board: boardClone(this.board),
      redTurn: this.redTurn,
      lastFrom: this.lastFrom,
      lastTo: this.lastTo
    });

    const captured = this.board[tr][tc];
    this.board[tr][tc] = this.board[fr][fc];
    this.board[fr][fc] = 0;
    this.lastFrom = [fr, fc];
    this.lastTo = [tr, tc];
    this.selected = null;
    this.validMoves = [];
    this.redTurn = !this.redTurn;

    this.render();

    // Check game state
    const inCheck = isInCheck(this.board, this.redTurn);
    const noMoves = isCheckmate(this.board, this.redTurn);

    if (noMoves) {
      // Game over - previous player wins
      setTimeout(() => this.showGameOver(!this.redTurn), 300);
    } else if (inCheck) {
      this.showCheck();
    }

    this.updateUI(inCheck);
  }

  undoMove() {
    if (this.history.length === 0) return;
    const prev = this.history.pop();
    this.board = prev.board;
    this.redTurn = prev.redTurn;
    this.lastFrom = prev.lastFrom;
    this.lastTo = prev.lastTo;
    this.selected = null;
    this.validMoves = [];
    this.gameOver = false;
    document.getElementById('overlay').classList.remove('show');
    this.render();
    this.updateUI();
  }

  newGame() {
    this.board = createInitialBoard();
    this.redTurn = true;
    this.selected = null;
    this.validMoves = [];
    this.history = [];
    this.lastFrom = null;
    this.lastTo = null;
    this.gameOver = false;
    document.getElementById('overlay').classList.remove('show');
    this.render();
    this.updateUI();
  }

  render() {
    this.renderer.render(
      this.board,
      this.selected,
      this.validMoves,
      this.lastFrom,
      this.lastTo
    );
  }

  updateUI(inCheck) {
    const redCard = document.getElementById('card-red');
    const blackCard = document.getElementById('card-black');
    const redInd = document.getElementById('ind-red');
    const blackInd = document.getElementById('ind-black');
    const redStatus = document.getElementById('status-red');
    const blackStatus = document.getElementById('status-black');
    const msg = document.getElementById('status-msg');

    if (this.redTurn) {
      redCard.classList.add('active');
      blackCard.classList.remove('active');
      redInd.textContent = '行棋';
      redInd.classList.add('active');
      blackInd.textContent = '';
      blackInd.classList.remove('active');
      redStatus.textContent = inCheck ? '⚠️ 被将军！' : '行棋中';
      blackStatus.textContent = '等待中';
      msg.textContent = inCheck ? '⚠️ 红方被将军，请解围！' : '红方请落子';
    } else {
      blackCard.classList.add('active');
      redCard.classList.remove('active');
      blackInd.textContent = '行棋';
      blackInd.classList.add('active');
      redInd.textContent = '';
      redInd.classList.remove('active');
      blackStatus.textContent = inCheck ? '⚠️ 被将军！' : '行棋中';
      redStatus.textContent = '等待中';
      msg.textContent = inCheck ? '⚠️ 黑方被将军，请解围！' : '黑方请落子';
    }
  }

  showCheck() {
    const alert = document.getElementById('check-alert');
    alert.classList.add('show');
    setTimeout(() => alert.classList.remove('show'), 1500);
  }

  showGameOver(redWins) {
    this.gameOver = true;
    document.getElementById('modal-icon').textContent = redWins ? '🏆' : '🏆';
    document.getElementById('modal-title').textContent = redWins ? '红方胜利' : '黑方胜利';
    document.getElementById('modal-sub').textContent = '将军！对方无路可走';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('status-msg').textContent = redWins ? '红方胜利！' : '黑方胜利！';
  }
}

// Start game
const game = new ChessGame();
</script>
