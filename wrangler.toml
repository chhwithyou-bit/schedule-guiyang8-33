name = "schedule-guiyang8-33"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "6a08c97d81c5489aa0f73be62c798627"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallbacks = []

[assets]
directory = "./public"


[[r2_buckets]]
binding = "MUSIC_BUCKET"
bucket_name = "music"

[[r2_buckets]]
binding = "COMMUNITY_R2"
bucket_name = "community-media" # 等待创建

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "community_db"
database_id = "6d9636b4-a7a9-4451-a701-7f48df456c6e"

[vars]
# Google Drive Folder ID
# 注意：GDRIVE_JSON 应该存为 Secret，而不是公开在 vars 里
GDRIVE_FOLDER_ID = "请在 GitHub Secrets 中设置，或者在这里填入文件夹 ID"