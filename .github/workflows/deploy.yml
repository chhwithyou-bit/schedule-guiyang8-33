name: Deploy 8community
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install -g wrangler
        
      - name: Initialize D1 Database and R2
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_AUTH_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Error: CLOUDFLARE_ACCOUNT_ID is required to use wrangler with Email/Key auth."
            exit 1
          fi

          echo "Attempting to create D1 Database..."
          wrangler d1 create community_db || true
          
          # 尝试获取 D1 数据库的 ID
          DB_ID=$(wrangler d1 info community_db --json | grep -o '"uuid": "[^"]*' | cut -d'"' -f4)
          
          if [ -n "$DB_ID" ]; then
            echo "Database ID found: $DB_ID"
            # 动态替换 wrangler.toml 中的占位符
            sed -i "s/在这里填入你创建的D1数据库的ID/$DB_ID/g" wrangler.toml
            
            # 执行建表 SQL
            echo "Executing schema.sql..."
            wrangler d1 execute community_db --remote --file=./schema.sql || true
          else
            echo "Warning: Could not find Database ID."
          fi
          
          # 尝试创建 R2 存储桶
          echo "Attempting to create R2 Bucket..."
          wrangler r2 bucket create community-media || true
          
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_AUTH_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
