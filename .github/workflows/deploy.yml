name: Deploy 8community

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            v5-svelte-migration/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install legacy web dependencies
        run: npm --prefix ./v5-svelte-migration ci

      - name: Check new workspace packages
        run: |
          npm run check:web
          npm run check:api
          npm run check:db

      - name: Build web compatibility shell
        run: npm run build:web:compat

      - name: Verify unit tests
        run: npm run test:unit

      - name: Initialize D1 Database and R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Attempting to create D1 Database..."
          wrangler d1 create community_db || true

          echo "Executing schema.sql..."
          wrangler d1 execute community_db --remote --file=./schema.sql || true

          echo "Attempting to create R2 Bucket..."
          wrangler r2 bucket create community-media || true

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
