name: Byoip DNS Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取IP列表并测速更新DNS
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
          IPREGISTRY_API_KEY: ${{ secrets.IPREGISTRY_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, subprocess, ipaddress, random, time

          email      = os.environ['CF_AUTH_EMAIL']
          key        = os.environ['CF_AUTH_KEY']
          zone_id    = os.environ['ZONE_ID']
          ipreg_key  = os.environ['IPREGISTRY_API_KEY']

          CF_HEADERS = {
              'X-Auth-Email': email,
              'X-Auth-Key': key,
              'Content-Type': 'application/json'
          }
          DNS_NAME   = 'xn--3prv04ai7du1mlsm.icu'
          TEST_PORT  = 443
          # 每个 /24 段只抽样 1 个 IP，控制总测速数量
          SAMPLE_PER_PREFIX = 1
          # 测速并发超时（秒）
          TEST_TIMEOUT = 4

          # ── 1. 从 ipregistry 拉取 AS209242 全量 prefix ──────────────────
          print('📡 正在从 ipregistry 拉取 AS209242 prefix 列表...')
          try:
              url = f'https://api.ipregistry.co/AS209242?key={ipreg_key}&fields=prefixes'
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              raw = urllib.request.urlopen(req, timeout=15).read()
              data = json.loads(raw)
              prefixes_v4 = [p['prefix'] for p in data.get('prefixes', {}).get('ipv4', [])]
              print(f'✅ 获取到 {len(prefixes_v4)} 个 IPv4 prefix')
          except Exception as e:
              print(f'❌ 拉取 prefix 失败: {e}，保留现有DNS')
              exit(0)

          if not prefixes_v4:
              print('❌ prefix 列表为空，保留现有DNS')
              exit(0)

          # ── 2. 从每个 prefix 采样候选 IP ────────────────────────────────
          candidates = []
          for cidr in prefixes_v4:
              try:
                  net = ipaddress.IPv4Network(cidr, strict=False)
                  # 跳过过小的段（/31 /32）
                  if net.num_addresses < 4:
                      continue
                  # 排除网络地址和广播地址，随机采样
                  hosts = list(net.hosts())
                  sample = random.sample(hosts, min(SAMPLE_PER_PREFIX, len(hosts)))
                  candidates.extend([str(ip) for ip in sample])
              except Exception:
                  continue

          print(f'🎯 候选IP数量: {len(candidates)}')
          random.shuffle(candidates)

          # ── 3. 测速：curl 连接 443 端口测延迟 ───────────────────────────
          def measure_latency(ip):
              """返回延迟毫秒数，失败返回 None"""
              try:
                  result = subprocess.run(
                      [
                          'curl', '-o', '/dev/null', '-s',
                          '--connect-timeout', str(TEST_TIMEOUT),
                          '--max-time', str(TEST_TIMEOUT),
                          '-w', '%{time_connect}',
                          f'https://{ip}/',
                          '--resolve', f'{DNS_NAME}:443:{ip}',
                          '--insecure'   # IP直连，忽略证书域名匹配
                      ],
                      capture_output=True, timeout=TEST_TIMEOUT + 2, text=True
                  )
                  val = result.stdout.strip()
                  if val and float(val) > 0:
                      return round(float(val) * 1000, 1)  # 转换为 ms
                  return None
              except Exception:
                  return None

          print('⏱  开始测速（443端口连接延迟）...')
          results = []  # [(latency_ms, ip)]

          for ip in candidates:
              latency = measure_latency(ip)
              if latency is not None:
                  results.append((latency, ip))
                  print(f'  ✅ {ip:>18}  {latency:>7.1f} ms')
              else:
                  print(f'  ❌ {ip:>18}  超时/不通')

          if not results:
              print('❌ 所有候选IP均不可用，保留现有DNS')
              exit(0)

          # ── 4. 选出延迟最低的 IP ─────────────────────────────────────────
          results.sort(key=lambda x: x[0])
          best_latency, best_ip = results[0]
          print(f'\n🏆 最优IP: {best_ip}  延迟: {best_latency} ms')

          # ── 5. 查询当前 DNS 记录 ─────────────────────────────────────────
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records'
              f'?type=A&name={DNS_NAME}',
              headers=CF_HEADERS
          )
          dns_data = json.loads(urllib.request.urlopen(req).read())
          records = dns_data.get('result', [])

          if not records:
              print('⚠️  未找到现有A记录，将创建新记录')
              # 创建新记录
              body = json.dumps({
                  'type': 'A',
                  'name': DNS_NAME,
                  'content': best_ip,
                  'ttl': 60,
                  'proxied': False
              }).encode()
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records',
                  data=body, headers=CF_HEADERS, method='POST'
              )
              res = json.loads(urllib.request.urlopen(req).read())
              if res['success']:
                  print(f'✅ DNS记录创建成功: {best_ip}')
              else:
                  print(f'❌ 创建失败: {res}')
                  exit(1)
          else:
              record    = records[0]
              record_id = record['id']
              current_ip = record['content']
              print(f'📌 当前DNS: {current_ip}')

              if current_ip == best_ip:
                  print('✅ IP未变化，无需更新')
                  exit(0)

              # ── 6. PATCH 更新（比删除重建更安全，无瞬断窗口）──────────
              body = json.dumps({
                  'type': 'A',
                  'name': DNS_NAME,
                  'content': best_ip,
                  'ttl': 60,
                  'proxied': False
              }).encode()
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}',
                  data=body, headers=CF_HEADERS, method='PATCH'
              )
              res = json.loads(urllib.request.urlopen(req).read())
              if res['success']:
                  print(f'✅ DNS更新成功: {current_ip} → {best_ip}  (延迟 {best_latency} ms)')
              else:
                  print(f'❌ 更新失败: {res}')
                  exit(1)

          PYEOF
