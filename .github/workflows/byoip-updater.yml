name: Byoip DNS Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 更新DNS
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, subprocess, random

          email = os.environ['CF_AUTH_EMAIL']
          key = os.environ['CF_AUTH_KEY']
          zone_id = os.environ['ZONE_ID']
          headers = {'X-Auth-Email': email, 'X-Auth-Key': key, 'Content-Type': 'application/json'}

          # 按ITDog测速结果排序，延迟低的在前
          MY_IPS = [
              "91.193.59.120",
              "91.193.59.17",
              "91.193.59.179",
              "91.193.59.168",
              "91.193.59.123",
              "91.193.59.19",
              "91.193.59.167",
          ]

          # 随机打乱，避免总用同一个IP
          random.shuffle(MY_IPS)

          # 用nc检测443端口
          def check(ip):
              try:
                  result = subprocess.run(
                      ['nc', '-z', '-w', '3', ip, '443'],
                      capture_output=True, timeout=5)
                  return result.returncode == 0
              except:
                  return False

          best_ip = None
          for ip in MY_IPS:
              if check(ip):
                  best_ip = ip
                  print(f'✅ 可用: {ip}')
                  break
              else:
                  print(f'❌ 不通: {ip}')

          if not best_ip:
              print('所有IP不可用，保留现有DNS')
              exit(0)

          # 查当前DNS
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records',
              headers=headers)
          dns = json.loads(urllib.request.urlopen(req).read())
          record = dns['result'][0]
          record_id = record['id']
          current_ip = record['content']
          print(f'当前IP: {current_ip}')

          if current_ip == best_ip:
              print('✅ IP未变化')
              exit(0)

          # 删除旧记录
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}',
              headers=headers, method='DELETE')
          urllib.request.urlopen(req).read()

          # 创建新记录
          body = json.dumps({
              'type': 'A', 'name': 'xn--3prv04ai7du1mlsm.icu',
              'content': best_ip, 'ttl': 60, 'proxied': False
          }).encode()
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records',
              data=body, headers=headers, method='POST')
          result = json.loads(urllib.request.urlopen(req).read())
          if result['success']:
              print(f'✅ DNS更新成功: {current_ip} → {best_ip}')
          else:
              print(f'❌ 失败: {result}')
              exit(1)
          PYEOF
