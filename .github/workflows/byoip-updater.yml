name: Byoip DNS Updater

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 测试DNS接口
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
        run: |
          echo "=== 用账号ID方式查询 ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/7c2ffe3811c552918d720f4b0b819208/dns_records?zone_name=xn--3prv04ai7du1mlsm.icu" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY"
          
          echo ""
          echo "=== 用Punycode域名查Zone ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/zones?name=xn--3prv04ai7du1mlsm.icu" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY"
