name: Byoip DNS Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 更新DNS
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
        run: |
          # 从vps789拉取IP，优先选91.193.59.x段，其次91.193.58.x，最后才用其他
          DATA=$(curl -s -A "Mozilla/5.0" "https://vps789.com/public/sum/cfIpApi")
          BEST_IP=$(echo "$DATA" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          candidates = []
          for arr in data.get('data', {}).values():
              if isinstance(arr, list):
                  for item in arr:
                      if isinstance(item, dict) and 'ip' in item:
                          ip = item['ip']
                          score = item.get('avgScore', 0)
                          # 91.193.59.x段额外加分
                          if ip.startswith('91.193.59.'):
                              score += 1000
                          elif ip.startswith('91.193.58.'):
                              score += 500
                          candidates.append((score, ip))
          candidates.sort(reverse=True)
          print(candidates[0][1] if candidates else '')
          ")

          echo "最优IP: $BEST_IP"

          if [ -z "$BEST_IP" ]; then
            echo "未获取到IP，退出"
            exit 1
          fi

          DNS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY")

          RECORD_ID=$(echo "$DNS" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          CURRENT_IP=$(echo "$DNS" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['content'])")
          echo "当前IP: $CURRENT_IP"

          if [ "$CURRENT_IP" = "$BEST_IP" ]; then
            echo "✅ IP未变化"
            exit 0
          fi

          DEL=$(curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY")

          CREATE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"A\",\"name\":\"xn--3prv04ai7du1mlsm.icu\",\"content\":\"$BEST_IP\",\"ttl\":60,\"proxied\":false}")

          SUCCESS=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',False))")
          if [ "$SUCCESS" = "True" ]; then
            echo "✅ DNS更新成功: $CURRENT_IP → $BEST_IP"
          else
            echo "❌ DNS更新失败: $CREATE"
            exit 1
          fi
