name: Byoip DNS Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取优选IP并更新DNS
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          email = os.environ['CF_AUTH_EMAIL']
          key = os.environ['CF_AUTH_KEY']
          zone_id = os.environ['ZONE_ID']
          headers = {'X-Auth-Email': email, 'X-Auth-Key': key, 'Content-Type': 'application/json'}

          # 拉取优选IP
          req = urllib.request.Request('https://vps789.com/public/sum/cfIpApi', headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req, timeout=10).read())
          candidates = []
          for arr in data.get('data', {}).values():
              if isinstance(arr, list):
                  for item in arr:
                      if isinstance(item, dict) and 'ip' in item:
                          candidates.append((item.get('avgScore', 0), item['ip']))
          candidates.sort(reverse=True)
          best_ip = candidates[0][1]
          print(f'最优IP: {best_ip}')

          # 查当前DNS记录
          req = urllib.request.Request(f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records', headers=headers)
          raw = urllib.request.urlopen(req).read()
          result = json.loads(raw)
          record = result['result'][0]
          record_id = record['id']
          current_ip = record['content']
          print(f'当前IP: {current_ip}  记录ID: {record_id}')

          if current_ip == best_ip:
              print('IP未变化，无需更新')
              exit(0)

          # 删除旧记录
          import urllib.error
          try:
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}',
                  headers=headers, method='DELETE')
              del_raw = urllib.request.urlopen(req).read()
              print(f'删除结果: {del_raw.decode()}')
          except urllib.error.HTTPError as e:
              print(f'删除失败: {e.code} {e.read().decode()}')

          # 创建新记录
          body = json.dumps({'type': 'A', 'name': 'xn--3prv04ai7du1mlsm.icu', 'content': best_ip, 'ttl': 60, 'proxied': False}).encode()
          try:
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records',
                  data=body, headers=headers, method='POST')
              create_raw = urllib.request.urlopen(req).read()
              create_result = json.loads(create_raw)
              if create_result['success']:
                  print(f'✅ DNS更新成功: {current_ip} → {best_ip}')
              else:
                  print(f'❌ 创建失败: {create_result}')
                  exit(1)
          except urllib.error.HTTPError as e:
              print(f'创建失败: {e.code} {e.read().decode()}')
              exit(1)
          EOF
