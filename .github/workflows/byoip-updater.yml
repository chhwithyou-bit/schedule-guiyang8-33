name: Byoip DNS Updater

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: 查DNS记录
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
        run: |
          echo "=== 试路径1 ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/zones/0375a9c9a4aeb1187a2e82b077cba25b/dns_records" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY"
          
          echo ""
          echo "=== 试路径2 ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/zones/0375a9c9a4aeb1187a2e82b077cba25b/dns/records?per_page=100" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY"

          echo ""
          echo "=== 试路径3 GraphQL ==="
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/graphql" \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" \
            -H "X-Auth-Key: $CF_AUTH_KEY" \
            -H "Content-Type: application/json" \
            --data '{"query":"{ viewer { zones(filter: {zoneTag: \"0375a9c9a4aeb1187a2e82b077cba25b\"}) { id } } }"}'
