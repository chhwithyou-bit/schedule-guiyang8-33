<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>台球游戏 · 中式八球</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0f;
  --felt: #1a5c2e;
  --felt2: #1e6835;
  --rail: #3d2008;
  --rail2: #5a3010;
  --blue: #0a84ff;
  --red: #ff453a;
  --green: #30d158;
  --yellow: #ffd60a;
  --purple: #bf5af2;
  --orange: #ff9f0a;
  --text: #fff;
  --t2: rgba(255,255,255,0.6);
  --t3: rgba(255,255,255,0.3);
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --border: rgba(255,255,255,0.1);
}
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
  height: 100%;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('/bg.jpg') center/cover no-repeat;
  opacity: 0.13;
  z-index: 0;
  pointer-events: none;
}
#app { position: relative; z-index: 1; }

/* ===== LAYOUT ===== */
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* ===== TOP BAR ===== */
.topbar {
  display:flex; align-items:center; gap:10px;
  padding: env(safe-area-inset-top, 12px) 16px 10px;
  padding-top: max(env(safe-area-inset-top, 0px), 12px);
  background: rgba(0,0,0,0.8); backdrop-filter:blur(12px);
  flex-shrink:0; border-bottom:1px solid var(--border);
  z-index:10;
}
.back-btn {
  background:var(--s2); border:none; color:var(--text);
  width:34px; height:34px; border-radius:9px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  flex-shrink:0;
}
.topbar-title { font-size:17px; font-weight:700; flex:1; }
.topbar-sub { font-size:11px; color:var(--t2); }

/* ===== SCOREBOARD ===== */
.scoreboard {
  display:flex; align-items:stretch; background:rgba(0,0,0,0.5);
  flex-shrink:0; border-bottom:1px solid var(--border);
}
.player-panel {
  flex:1; padding:10px 14px; position:relative; transition:background .3s;
}
.player-panel.active { background:rgba(255,255,255,0.06); }
.player-panel.active::after {
  content:''; position:absolute; bottom:0; left:0; right:0;
  height:2px; background:var(--blue);
}
.player-panel.p1.active::after { background:#ffd60a; }
.player-panel.p2.active::after { background:#3b9ddd; }
.player-name { font-size:12px; font-weight:600; color:var(--t2); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
.player-balls { display:flex; flex-wrap:wrap; gap:3px; min-height:18px; }
.score-sep { width:1px; background:var(--border); flex-shrink:0; }
.vs-badge { display:flex; align-items:center; justify-content:center; padding:0 10px; color:var(--t3); font-size:11px; font-weight:700; }
.turn-arrow { font-size:10px; }
.fouls-badge { font-size:10px; background:rgba(255,69,58,0.2); color:#ff453a; padding:1px 5px; border-radius:4px; display:none; }
.fouls-badge.show { display:inline; }

/* ===== STATUS BAR ===== */
.status-bar {
  background:rgba(0,0,0,0.6); padding:6px 16px;
  font-size:13px; color:var(--t2); text-align:center; flex-shrink:0;
  min-height:30px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.status-bar .tag {
  font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;
  background:rgba(10,132,255,0.2); color:var(--blue);
}

/* ===== TABLE WRAPPER ===== */
.table-wrap {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:8px; overflow:hidden; position:relative;
}

canvas#table {
  border-radius:6px;
  box-shadow: 0 0 0 8px #3d2008, 0 0 0 14px #2a1505, 0 20px 60px rgba(0,0,0,0.8);
  cursor: crosshair;
  touch-action: none;
  display:block;
}

/* ===== CONTROLS ===== */
.controls {
  flex-shrink:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 16px; padding-bottom: max(env(safe-area-inset-bottom,0px), 10px);
  display:flex; align-items:center; gap:12px;
}
.power-wrap { flex:1; display:flex; align-items:center; gap:8px; }
.power-label { font-size:11px; color:var(--t2); width:24px; text-align:right; flex-shrink:0; }
.power-slider {
  flex:1; -webkit-appearance:none; appearance:none;
  height:6px; border-radius:3px; background:var(--s2); outline:none; cursor:pointer;
}
.power-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 0 6px rgba(0,0,0,0.5); cursor:pointer;
}
.power-val { font-size:11px; color:var(--t2); width:28px; flex-shrink:0; }
.shoot-btn {
  background:var(--blue); border:none; color:#fff;
  padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700;
  font-family:inherit; cursor:pointer; flex-shrink:0; transition:all .15s;
}
.shoot-btn:active { transform:scale(.95); opacity:.85; }
.shoot-btn:disabled { background:var(--s2); color:var(--t3); cursor:not-allowed; }

/* ===== OVERLAY ===== */
.overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
  z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(8px);
}
.overlay.show { display:flex; }
.overlay-card {
  background:var(--s1); border-radius:20px; padding:28px 24px;
  max-width:320px; width:90%; text-align:center;
}
.overlay-icon { font-size:56px; margin-bottom:12px; }
.overlay-title { font-size:22px; font-weight:700; margin-bottom:6px; }
.overlay-sub { font-size:14px; color:var(--t2); margin-bottom:20px; line-height:1.6; }
.overlay-btn {
  width:100%; padding:14px; border-radius:12px; border:none;
  background:var(--blue); color:#fff; font-size:16px; font-weight:700;
  font-family:inherit; cursor:pointer; margin-bottom:8px;
}
.overlay-btn.sec { background:var(--s2); color:var(--t2); }

/* ===== FOUL TOAST ===== */
.foul-toast {
  position:fixed; top:120px; left:50%; transform:translateX(-50%);
  background:#ff453a; color:#fff; padding:8px 18px; border-radius:20px;
  font-size:14px; font-weight:700; z-index:100;
  opacity:0; transition:opacity .2s; pointer-events:none;
  white-space:nowrap;
}
.foul-toast.show { opacity:1; }

/* ===== CUE BALL PLACEMENT ===== */
.place-hint {
  position:fixed; top:120px; left:50%; transform:translateX(-50%);
  background:rgba(255,214,10,0.9); color:#000; padding:6px 14px; border-radius:16px;
  font-size:13px; font-weight:700; z-index:100; pointer-events:none; display:none;
}
.place-hint.show { display:block; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('/bg.jpg') center/cover no-repeat;
  opacity: 0.13;
  z-index: 0;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">‹</button>
    <div>
      <div class="topbar-title">🎱 中式八球</div>
      <div class="topbar-sub">两人对战</div>
    </div>
    <button onclick="confirmRestart()" style="background:var(--s2);border:none;color:var(--t2);padding:6px 12px;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer;">重开</button>
  </div>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <div class="player-panel p1 active" id="panel1">
      <div class="player-name">
        <span>🟡 玩家一</span>
        <span class="turn-arrow" id="arrow1">◀</span>
        <span class="fouls-badge" id="foul1"></span>
      </div>
      <div class="player-balls" id="balls1"></div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="score-sep"></div>
    <div class="player-panel p2" id="panel2">
      <div class="player-name">
        <span>🔵 玩家二</span>
        <span class="turn-arrow" id="arrow2" style="display:none">▶</span>
        <span class="fouls-badge" id="foul2"></span>
      </div>
      <div class="player-balls" id="balls2"></div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="status-bar" id="statusBar">
    <span>🎱 玩家一开球</span>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <canvas id="table"></canvas>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="power-wrap">
      <span class="power-label">力度</span>
      <input type="range" class="power-slider" id="powerSlider" min="5" max="100" value="40">
      <span class="power-val" id="powerVal">40%</span>
    </div>
    <button class="shoot-btn" id="shootBtn" disabled>击球</button>
  </div>

</div>

<!-- OVERLAYS -->
<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="overlay-icon" id="winIcon">🏆</div>
    <div class="overlay-title" id="winTitle">玩家一获胜！</div>
    <div class="overlay-sub" id="winSub">恭喜完成比赛</div>
    <button class="overlay-btn" onclick="restartGame()">🔄 再来一局</button>
    <button class="overlay-btn sec" onclick="location.href='index.html'">返回主页</button>
  </div>
</div>

<div class="overlay" id="foulPlaceOverlay" style="display:none"></div>

<div class="foul-toast" id="foulToast"></div>
<div class="place-hint" id="placeHint">点击桌面放置白球</div>

<script>
// =====================================================
// CHINESE 8-BALL BILLIARDS — PHYSICS ENGINE
// =====================================================

const canvas = document.getElementById('table');
const ctx = canvas.getContext('2d');

// ===== CONSTANTS =====
const FRICTION = 0.988;
const SPIN_DECAY = 0.94;
const RESTITUTION = 0.92;   // ball-ball
const RAIL_RESTITUTION = 0.75;
const MIN_VEL = 0.08;
const BALL_R = 0; // set on resize

let W, H, R, POCKET_R, scale;

// Ball colors (Chinese 8-ball: 1-7 solid, 8 black, 9-15 striped)
// For simplicity we use 1-7 yellow (P1) and 9-15 blue (P2), 8 black
const BALL_COLORS = {
  0: '#fff',          // cue
  1: '#e8c832', 2: '#e04030', 3: '#2266cc', 4: '#8833aa',
  5: '#dd6622', 6: '#228844', 7: '#cc2244',
  8: '#111',          // 8-ball
  9: '#e8c832', 10: '#e04030', 11: '#2266cc', 12: '#8833aa',
  13: '#dd6622', 14: '#228844', 15: '#cc2244'
};
const STRIPE_BALLS = [9,10,11,12,13,14,15];
const SOLID_BALLS  = [1,2,3,4,5,6,7];

// ===== POCKET POSITIONS (fractions of table) =====
// Will be computed in resize()
let POCKETS = [];

// ===== GAME STATE =====
let balls = [];
let currentPlayer = 0; // 0 or 1
let playerGroups = [null, null]; // 'solid' or 'stripe'
let pottedBalls = [[],[]];
let gamePhase = 'placing'; // 'placing' | 'aiming' | 'shooting' | 'settling' | 'foul_place' | 'over'
let breakShot = true;
let foulCommitted = false;
let shotHitFirst = null; // which ball cue hit first this shot
let pottedThisShot = [];
let cuePottedThisShot = false;
let eightPottedThisShot = false;
let aimAngle = Math.PI; // radians, where cue is aiming
let shotFired = false;
let touchStartPos = null;
let lastTouchPos = null;
let isDragging = false;
let placingCueBall = false;
let placingX = 0, placingY = 0;
let animFrame = null;

// Power
const powerSlider = document.getElementById('powerSlider');
const powerVal = document.getElementById('powerVal');
powerSlider.addEventListener('input', () => {
  powerVal.textContent = powerSlider.value + '%';
});

// ===== BALL CLASS =====
class Ball {
  constructor(id, x, y) {
    this.id = id;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.spin = 0; // angular velocity
    this.potted = false;
    this.isMoving = () => Math.abs(this.vx) > MIN_VEL || Math.abs(this.vy) > MIN_VEL;
  }
}

// ===== RESIZE =====
function resize() {
  const wrap = document.querySelector('.table-wrap');
  const rect = wrap.getBoundingClientRect();
  const ww = (rect.width > 0 ? rect.width : window.innerWidth) - 16;
  const wh = (rect.height > 0 ? rect.height : window.innerHeight * 0.55) - 16;

  // Table is 2:1 ratio
  let tw = ww, th = tw / 2;
  if (th > wh) { th = wh; tw = th * 2; }
  if (tw < 100) { tw = window.innerWidth - 16; th = tw / 2; }

  canvas.width = Math.floor(tw);
  canvas.height = Math.floor(th);

  W = canvas.width;
  H = canvas.height;
  R = H * 0.038;  // ball radius
  POCKET_R = R * 1.55;
  scale = W / 800;

  // Pocket positions [x, y]
  const rx = R * 0.7, ry = R * 0.7;
  POCKETS = [
    [rx, ry],           // TL
    [W/2, -R*0.2],      // TM
    [W-rx, ry],         // TR
    [rx, H-ry],         // BL
    [W/2, H+R*0.2],     // BM
    [W-rx, H-ry],       // BR
  ];
}

// ===== RACK SETUP =====
function rackBalls() {
  balls = [];

  // Cue ball
  const cue = new Ball(0, W * 0.25, H * 0.5);
  balls.push(cue);

  // Triangle rack — 5 rows, apex at 3/4 width
  const apex = { x: W * 0.72, y: H * 0.5 };
  const dx = R * 2.02, dy = R * 2.02;

  // Standard Chinese 8-ball rack pattern
  const pattern = [
    [1],
    [9, 2],
    [3, 8, 10],
    [11, 4, 5, 12],
    [6, 13, 14, 7, 15]
  ];

  for (let row = 0; row < pattern.length; row++) {
    const cols = pattern[row];
    for (let col = 0; col < cols.length; col++) {
      const id = cols[col];
      const x = apex.x + row * dx;
      const y = apex.y + (col - (cols.length-1)/2) * dy;
      balls.push(new Ball(id, x, y));
    }
  }
}

// ===== DRAW =====
function drawTable() {
  const rail = 0; // canvas edge IS the rail edge (rail drawn as shadow)

  // Felt background with subtle pattern
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#1a5f30');
  grad.addColorStop(0.5, '#1e6835');
  grad.addColorStop(1, '#1a5f30');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle felt lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += R*4) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  // Center circle
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(W/2, H/2, R*3, 0, Math.PI*2); ctx.stroke();

  // Baulk line (1/4 from left)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(W*0.25, 0); ctx.lineTo(W*0.25, H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W*0.25, H/2, R*2.5, -Math.PI/2, Math.PI/2); ctx.stroke();

  // Cushion marking dots
  const dotColor = 'rgba(255,255,255,0.25)';
  const dotPos = [1/4, 1/2, 3/4];
  dotPos.forEach(p => {
    ctx.fillStyle = dotColor;
    ctx.beginPath(); ctx.arc(W*p, R*0.3, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W*p, H-R*0.3, 2.5, 0, Math.PI*2); ctx.fill();
  });
  [1/4, 1/2, 3/4].forEach(p => {
    ctx.beginPath(); ctx.arc(R*0.3, H*p, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W-R*0.3, H*p, 2.5, 0, Math.PI*2); ctx.fill();
  });
}

function drawPockets() {
  POCKETS.forEach(([px, py]) => {
    // Pocket shadow
    const g = ctx.createRadialGradient(px, py, 0, px, py, POCKET_R*1.2);
    g.addColorStop(0, 'rgba(0,0,0,0.95)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.7)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, POCKET_R*1.2, 0, Math.PI*2); ctx.fill();

    // Pocket hole
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(px, py, POCKET_R, 0, Math.PI*2); ctx.fill();

    // Pocket rim
    ctx.strokeStyle = 'rgba(80,40,5,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, POCKET_R, 0, Math.PI*2); ctx.stroke();
  });
}

function drawBall(b) {
  if (b.potted) return;
  const x = b.x, y = b.y, id = b.id;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x+R*0.25, y+R*0.35, R*0.85, R*0.4, 0, 0, Math.PI*2); ctx.fill();

  // Base color
  const color = BALL_COLORS[id] || '#fff';
  if (STRIPE_BALLS.includes(id)) {
    // Stripe ball: white base with color stripe
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = color;
    ctx.fillRect(x-R, y-R*0.42, R*2, R*0.84);
    ctx.restore();
  } else {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
  }

  // Shine
  const shine = ctx.createRadialGradient(x-R*0.35, y-R*0.35, 0, x, y, R);
  shine.addColorStop(0, 'rgba(255,255,255,0.55)');
  shine.addColorStop(0.4, 'rgba(255,255,255,0.1)');
  shine.addColorStop(1, 'rgba(0,0,0,0.2)');
  ctx.fillStyle = shine;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();

  // Number
  if (id !== 0) {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${R*0.85}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // Number circle background for stripe balls
    if (STRIPE_BALLS.includes(id) || id === 8) {
      ctx.fillStyle = id===8 ? '#111' : '#fff';
      ctx.beginPath(); ctx.arc(x, y, R*0.52, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = (STRIPE_BALLS.includes(id) || [1,2,3,4,5,6,7].includes(id)) && color !== '#111'
      ? (id===8?'#fff':'#222') : '#fff';
    if (id === 8) ctx.fillStyle = '#fff';
    ctx.font = `bold ${R * (id>=10?0.7:0.8)}px -apple-system, sans-serif`;
    ctx.fillText(id, x, y+0.5);
  }

  // Outline
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.stroke();
}

function drawCue() {
  if (gamePhase !== 'aiming') return;
  const cue = balls.find(b => b.id === 0 && !b.potted);
  if (!cue) return;

  const power = parseInt(powerSlider.value) / 100;
  const len = W * 0.45;
  const tipX = cue.x - Math.cos(aimAngle) * (R + 2);
  const tipY = cue.y - Math.sin(aimAngle) * (R + 2);
  const endX = tipX + Math.cos(aimAngle) * len;
  const endY = tipY + Math.sin(aimAngle) * len;

  // Aim line (dashed)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(cue.x + Math.cos(aimAngle+Math.PI) * R, cue.y + Math.sin(aimAngle+Math.PI) * R);
  ctx.lineTo(cue.x + Math.cos(aimAngle+Math.PI) * R * 20);
  ctx.lineTo(cue.y + Math.sin(aimAngle+Math.PI) * R * 20);
  // Actually: aim line in direction cue ball will go
  const aimLen = R * 15;
  ctx.moveTo(cue.x - Math.cos(aimAngle) * R, cue.y - Math.sin(aimAngle) * R);
  ctx.lineTo(cue.x - Math.cos(aimAngle) * aimLen, cue.y - Math.sin(aimAngle) * aimLen);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Cue stick
  const cueGrad = ctx.createLinearGradient(tipX, tipY, endX, endY);
  cueGrad.addColorStop(0, '#e8d4a0');
  cueGrad.addColorStop(0.15, '#c8a060');
  cueGrad.addColorStop(0.5, '#8B5E2A');
  cueGrad.addColorStop(1, '#5a3a1a');

  ctx.save();
  ctx.strokeStyle = cueGrad;
  ctx.lineWidth = 6 * scale;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(endX, endY);
  ctx.stroke();

  // Tip
  ctx.fillStyle = '#d4a820';
  ctx.beginPath(); ctx.arc(tipX, tipY, 3.5*scale, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  // Power indicator arc
  ctx.save();
  ctx.strokeStyle = `hsl(${120 - power*120}, 80%, 50%)`;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(cue.x, cue.y, R+6, aimAngle+0.2, aimAngle + Math.PI*2*power + 0.2);
  ctx.stroke();
  ctx.restore();
}

// ===== PLACING CUE BALL =====
function drawPlacementCursor() {
  if (gamePhase !== 'foul_place') return;
  const valid = isValidPlacement(placingX, placingY);

  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = valid ? 'rgba(255,255,255,0.8)' : 'rgba(255,50,50,0.7)';
  ctx.beginPath(); ctx.arc(placingX, placingY, R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = valid ? '#fff' : '#ff4040';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function isValidPlacement(x, y) {
  if (x - R < 0 || x + R > W || y - R < 0 || y + R > H) return false;
  // Must be in baulk area after foul
  if (x > W * 0.5) return false;
  // Check no overlap
  for (const b of balls) {
    if (b.potted || b.id === 0) continue;
    const dx = b.x - x, dy = b.y - y;
    if (Math.sqrt(dx*dx+dy*dy) < R*2.1) return false;
  }
  // Not in pocket
  for (const [px,py] of POCKETS) {
    const dx = px-x, dy = py-y;
    if (Math.sqrt(dx*dx+dy*dy) < POCKET_R) return false;
  }
  return true;
}

// ===== RENDER LOOP =====
function render() {
  ctx.clearRect(0, 0, W, H);
  drawTable();
  drawPockets();

  // Draw aim/cue first (behind balls)
  drawCue();

  // Balls
  balls.forEach(b => drawBall(b));

  // Placement cursor
  drawPlacementCursor();

  animFrame = requestAnimationFrame(render);
}

// ===== PHYSICS =====
function stepPhysics() {
  const activeBalls = balls.filter(b => !b.potted);

  // Move
  activeBalls.forEach(b => {
    if (!b.isMoving()) { b.vx = 0; b.vy = 0; return; }
    b.x += b.vx;
    b.y += b.vy;
    b.vx *= FRICTION;
    b.vy *= FRICTION;
    b.spin *= SPIN_DECAY;

    // Rail collisions
    const mr = R;
    let hit = false;
    if (b.x - mr < 0) { b.x = mr; b.vx = Math.abs(b.vx)*RAIL_RESTITUTION; hit=true; }
    if (b.x + mr > W) { b.x = W-mr; b.vx = -Math.abs(b.vx)*RAIL_RESTITUTION; hit=true; }
    if (b.y - mr < 0) { b.y = mr; b.vy = Math.abs(b.vy)*RAIL_RESTITUTION; hit=true; }
    if (b.y + mr > H) { b.y = H-mr; b.vy = -Math.abs(b.vy)*RAIL_RESTITUTION; hit=true; }
    if (hit) { b.vx*=0.95; b.vy*=0.95; }
  });

  // Ball-ball collisions
  for (let i = 0; i < activeBalls.length; i++) {
    for (let j = i+1; j < activeBalls.length; j++) {
      const a = activeBalls[i], b = activeBalls[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const minDist = R*2;
      if (dist < minDist && dist > 0.001) {
        // Track first contact for cue ball
        if (a.id === 0 && shotHitFirst === null) shotHitFirst = b.id;
        if (b.id === 0 && shotHitFirst === null) shotHitFirst = a.id;

        // Separate
        const nx = dx/dist, ny = dy/dist;
        const overlap = (minDist - dist) / 2;
        a.x -= nx*overlap; a.y -= ny*overlap;
        b.x += nx*overlap; b.y += ny*overlap;

        // Impulse
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const dot = rvx*nx + rvy*ny;
        if (dot < 0) {
          const imp = dot * RESTITUTION;
          a.vx += imp*nx; a.vy += imp*ny;
          b.vx -= imp*nx; b.vy -= imp*ny;
          // Spin transfer
          const spinImp = (a.spin - b.spin) * 0.08;
          a.spin -= spinImp; b.spin += spinImp;
        }
      }
    }
  }

  // Pocket check
  activeBalls.forEach(b => {
    POCKETS.forEach(([px,py]) => {
      const dx = b.x-px, dy = b.y-py;
      if (Math.sqrt(dx*dx+dy*dy) < POCKET_R * 0.85) {
        // Potted!
        b.potted = true;
        b.vx = 0; b.vy = 0;
        if (b.id === 0) cuePottedThisShot = true;
        else if (b.id === 8) eightPottedThisShot = true;
        else pottedThisShot.push(b.id);
      }
    });
  });
}

let physicsInterval = null;
let settling = false;

function startPhysics() {
  if (physicsInterval) clearInterval(physicsInterval);
  physicsInterval = setInterval(() => {
    if (gamePhase !== 'shooting') return;
    stepPhysics();

    // Check if all stopped
    const moving = balls.filter(b => !b.potted && b.isMoving());
    if (moving.length === 0) {
      clearInterval(physicsInterval);
      physicsInterval = null;
      onShotSettled();
    }
  }, 1000/120); // 120 fps physics
}

// ===== SHOT LOGIC =====
function shoot() {
  const cue = balls.find(b => b.id === 0 && !b.potted);
  if (!cue || gamePhase !== 'aiming') return;

  const power = parseInt(powerSlider.value) / 100;
  const speed = power * 28 * scale;

  cue.vx = -Math.cos(aimAngle) * speed;
  cue.vy = -Math.sin(aimAngle) * speed;
  cue.spin = speed * 0.1;

  shotHitFirst = null;
  pottedThisShot = [];
  cuePottedThisShot = false;
  eightPottedThisShot = false;

  gamePhase = 'shooting';
  document.getElementById('shootBtn').disabled = true;
  startPhysics();
}

function onShotSettled() {
  // Evaluate the shot
  let foul = false;
  let foulReason = '';
  const cp = currentPlayer;
  const op = 1 - cp;

  // Determine assignment
  if (breakShot) {
    // After break: if any balls potted, assign groups
    if (pottedThisShot.length > 0 && !cuePottedThisShot) {
      const firstPotted = pottedThisShot[0];
      if (SOLID_BALLS.includes(firstPotted)) {
        playerGroups[cp] = 'solid';
        playerGroups[op] = 'stripe';
      } else {
        playerGroups[cp] = 'stripe';
        playerGroups[op] = 'solid';
      }
    }
    if (cuePottedThisShot) { foul = true; foulReason = '白球入袋！'; }
    breakShot = false;
  } else {
    // Check foul: first contact must be own group ball (or 8-ball if clearing)
    const myGroup = playerGroups[cp];
    const myBallsLeft = balls.filter(b => !b.potted && (myGroup === 'solid' ? SOLID_BALLS.includes(b.id) : STRIPE_BALLS.includes(b.id)));

    if (myGroup !== null && shotHitFirst !== null) {
      const hitBall = balls.find(b => b.id === shotHitFirst);
      const isMyBall = myGroup === 'solid' ? SOLID_BALLS.includes(shotHitFirst) : STRIPE_BALLS.includes(shotHitFirst);
      const is8 = shotHitFirst === 8;
      if (!isMyBall && !(myBallsLeft.length === 0 && is8)) {
        foul = true; foulReason = '先触碰了对方的球！';
      }
    }
    if (shotHitFirst === null) { foul = true; foulReason = '白球未触及任何球！'; }
    if (cuePottedThisShot) { foul = true; foulReason = '白球入袋！'; }
  }

  // Check 8-ball win/loss
  if (eightPottedThisShot) {
    const myGroup = playerGroups[cp];
    const myBalls = balls.filter(b => !b.potted && (myGroup === 'solid' ? SOLID_BALLS.includes(b.id) : STRIPE_BALLS.includes(b.id)));
    if (myBalls.length === 0 && !foul) {
      // WIN
      showWin(cp, '完美！成功打入8号球！🎉');
      return;
    } else {
      // LOSS: potted 8 early or on foul
      showWin(op, cp === 0 ? '玩家一犯规打入8号球，玩家二获胜！' : '玩家二犯规打入8号球，玩家一获胜！');
      return;
    }
  }

  // Update potted balls display
  pottedThisShot.forEach(bid => {
    const isP1Ball = playerGroups[0] === 'solid' ? SOLID_BALLS.includes(bid) : STRIPE_BALLS.includes(bid);
    if (playerGroups[0] !== null) {
      pottedBalls[isP1Ball ? 0 : 1].push(bid);
    } else {
      // Pre-assignment: attribute to current player
      pottedBalls[cp].push(bid);
    }
  });
  updateScoreboard();

  if (foul) {
    showFoul(foulReason);
    // Opponent gets ball in hand (in baulk)
    currentPlayer = op;
    gamePhase = 'foul_place';
    const cueBall = balls.find(b => b.id === 0);
    if (cueBall) cueBall.potted = true; // hide while placing
    placingX = W * 0.2;
    placingY = H * 0.5;
    document.getElementById('placeHint').classList.add('show');
    updateUI();
    return;
  }

  // Continue: same player if potted own balls, else switch
  const myGroup = playerGroups[cp];
  const pottedOwn = pottedThisShot.filter(bid =>
    myGroup === null ? true :
    myGroup === 'solid' ? SOLID_BALLS.includes(bid) : STRIPE_BALLS.includes(bid)
  );
  if (pottedOwn.length > 0 && !foul) {
    // Same player continues
  } else {
    currentPlayer = op;
  }

  gamePhase = 'aiming';
  document.getElementById('shootBtn').disabled = false;
  updateUI();
}

// ===== UI =====
function setStatus(msg, tag='') {
  const bar = document.getElementById('statusBar');
  bar.innerHTML = tag ? `<span class="tag">${tag}</span> ${msg}` : msg;
}

function updateUI() {
  const names = ['玩家一', '玩家二'];
  const cp = currentPlayer;
  const op = 1-cp;
  const myGroup = playerGroups[cp];

  document.getElementById('panel1').classList.toggle('active', cp===0);
  document.getElementById('panel2').classList.toggle('active', cp===1);
  document.getElementById('arrow1').style.display = cp===0?'':'none';
  document.getElementById('arrow2').style.display = cp===1?'':'none';

  let statusMsg = `${names[cp]}出击`;
  if (myGroup) statusMsg += `（${myGroup === 'solid' ? '全色' : '花色'}球）`;
  if (gamePhase === 'foul_place') statusMsg = `${names[cp]} 获得自由球（点击放置白球）`;
  if (gamePhase === 'placing') statusMsg = '点击桌面放置白球开球';
  setStatus(statusMsg);
}

function updateScoreboard() {
  [0,1].forEach(p => {
    const el = document.getElementById('balls' + (p+1));
    el.innerHTML = '';
    const group = playerGroups[p];
    const myBalls = group === 'solid' ? SOLID_BALLS : group === 'stripe' ? STRIPE_BALLS : [];
    myBalls.forEach(bid => {
      const potted = pottedBalls[p].includes(bid);
      const inPlay = !balls.find(b => b.id === bid)?.potted;
      const dot = document.createElement('div');
      dot.style.cssText = `
        width:14px;height:14px;border-radius:50%;
        background:${BALL_COLORS[bid]};
        border:1.5px solid ${potted ? 'transparent':'rgba(255,255,255,0.3)'};
        opacity:${potted?'1':'0.3'};
        display:inline-block; flex-shrink:0;
        box-shadow: ${potted ? '0 0 4px rgba(255,255,255,0.3)' : 'none'};
      `;
      el.appendChild(dot);
    });
    // Show 8-ball status
    if (group !== null) {
      const remaining = myBalls.filter(bid => !balls.find(b=>b.id===bid)?.potted).length;
      if (remaining === 0) {
        const eight = document.createElement('div');
        eight.style.cssText = `width:14px;height:14px;border-radius:50%;background:#111;border:2px solid rgba(255,255,255,0.5);display:inline-block;`;
        eight.title='需打8号球';
        el.appendChild(eight);
      }
    }
  });
}

function showFoul(reason) {
  const toast = document.getElementById('foulToast');
  toast.textContent = '⚠ 犯规：' + reason;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showWin(player, msg) {
  gamePhase = 'over';
  const overlay = document.getElementById('winOverlay');
  document.getElementById('winIcon').textContent = player===0?'🏆':'🎊';
  document.getElementById('winTitle').textContent = `玩家${player===0?'一':'二'}获胜！`;
  document.getElementById('winSub').textContent = msg;
  overlay.classList.add('show');
}

// ===== INPUT =====
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] || e.changedTouches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (W / rect.width),
    y: (touch.clientY - rect.top) * (H / rect.height)
  };
}

// --- Placing cue ball at start ---
canvas.addEventListener('click', (e) => {
  const pos = getCanvasPos(e);

  if (gamePhase === 'placing') {
    // Initial cue ball placement in baulk
    if (pos.x < W*0.5 && isValidPlacement(pos.x, pos.y)) {
      const cue = balls.find(b => b.id === 0);
      cue.x = pos.x; cue.y = pos.y;
      cue.potted = false;
      gamePhase = 'aiming';
      document.getElementById('shootBtn').disabled = false;
      document.getElementById('placeHint').classList.remove('show');
      updateUI();
    }
    return;
  }

  if (gamePhase === 'foul_place') {
    // Placing after foul
    if (isValidPlacement(pos.x, pos.y)) {
      let cue = balls.find(b => b.id === 0);
      if (!cue) { cue = new Ball(0, pos.x, pos.y); balls.push(cue); }
      cue.x = pos.x; cue.y = pos.y;
      cue.potted = false; cue.vx = 0; cue.vy = 0;
      gamePhase = 'aiming';
      document.getElementById('shootBtn').disabled = false;
      document.getElementById('placeHint').classList.remove('show');
      updateUI();
    }
    return;
  }
});

// --- Aim by dragging ---
let isAiming = false;

canvas.addEventListener('mousedown', (e) => {
  if (gamePhase !== 'aiming') return;
  isAiming = true;
  updateAim(e);
});
canvas.addEventListener('mousemove', (e) => {
  if (!isAiming || gamePhase !== 'aiming') return;
  if (gamePhase === 'foul_place') { updatePlacement(e); return; }
  updateAim(e);
});
canvas.addEventListener('mouseup', () => { isAiming = false; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gamePhase === 'placing' || gamePhase === 'foul_place') {
    const pos = getCanvasPos(e);
    placingX = pos.x; placingY = pos.y;
    return;
  }
  if (gamePhase !== 'aiming') return;
  isAiming = true;
  updateAim(e);
}, {passive:false});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gamePhase === 'placing' || gamePhase === 'foul_place') {
    const pos = getCanvasPos(e);
    placingX = pos.x; placingY = pos.y;
    return;
  }
  if (!isAiming || gamePhase !== 'aiming') return;
  updateAim(e);
}, {passive:false});
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (gamePhase === 'placing') {
    const pos = getCanvasPos(e);
    if (pos.x < W*0.5 && isValidPlacement(pos.x, pos.y)) {
      const cue = balls.find(b => b.id === 0);
      cue.x = pos.x; cue.y = pos.y; cue.potted = false;
      gamePhase = 'aiming';
      document.getElementById('shootBtn').disabled = false;
      document.getElementById('placeHint').classList.remove('show');
      updateUI();
    }
    return;
  }
  if (gamePhase === 'foul_place') {
    const pos = getCanvasPos(e);
    if (isValidPlacement(pos.x, pos.y)) {
      let cue = balls.find(b => b.id === 0);
      if (!cue) { cue = new Ball(0, pos.x, pos.y); balls.push(cue); }
      cue.x = pos.x; cue.y = pos.y;
      cue.potted = false; cue.vx = 0; cue.vy = 0;
      gamePhase = 'aiming';
      document.getElementById('shootBtn').disabled = false;
      document.getElementById('placeHint').classList.remove('show');
      updateUI();
    }
    return;
  }
  isAiming = false;
}, {passive:false});

function updateAim(e) {
  const pos = getCanvasPos(e);
  const cue = balls.find(b => b.id === 0 && !b.potted);
  if (!cue) return;
  aimAngle = Math.atan2(pos.y - cue.y, pos.x - cue.x) + Math.PI;
}

function updatePlacement(e) {
  const pos = getCanvasPos(e);
  placingX = pos.x; placingY = pos.y;
}

// Shoot button
document.getElementById('shootBtn').addEventListener('click', () => {
  if (gamePhase === 'aiming') shoot();
});

// ===== GAME CONTROL =====
function restartGame() {
  document.getElementById('winOverlay').classList.remove('show');
  startGame();
}

function confirmRestart() {
  if (confirm('确定重新开始？')) restartGame();
}

function startGame() {
  currentPlayer = 0;
  playerGroups = [null, null];
  pottedBalls = [[],[]];
  breakShot = true;
  shotHitFirst = null;
  pottedThisShot = [];
  cuePottedThisShot = false;
  eightPottedThisShot = false;
  gamePhase = 'placing';
  aimAngle = Math.PI;

  rackBalls();
  // Hide cue ball until placed
  const cue = balls.find(b => b.id === 0);
  cue.potted = true;
  placingX = W * 0.2; placingY = H * 0.5;

  document.getElementById('shootBtn').disabled = true;
  document.getElementById('placeHint').classList.add('show');
  document.getElementById('balls1').innerHTML = '';
  document.getElementById('balls2').innerHTML = '';

  updateUI();
  setStatus('玩家一：点击左半区放置白球开球', '开始');
}

// ===== RESIZE & INIT =====
function init() {
  // Use requestAnimationFrame to ensure layout is complete before measuring
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      resize();
      startGame();
      cancelAnimationFrame(animFrame);
      render();
    });
  });
}

window.addEventListener('resize', () => {
  resize();
  // Rescale ball positions
  const oldW = W, oldH = H;
  // Simple: just restart positioning
  rackBalls();
  startGame();
});

init();
</script>
