<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贵阳八中杨成的(3)班</title>
<style>
/* 保持原有 iOS 风格变量 */
:root {
  --bg: #000; --s1: #1c1c1e; --s2: #2c2c2e; --blue: #0a84ff; --text: #fff;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; }

/* --- 抽屉侧边栏样式 --- */
.drawer {
  position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
  background: var(--s1); z-index: 1000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 10px 0 30px rgba(0,0,0,0.5); padding: 60px 20px;
}
.drawer.open { left: 0; }
.drawer-item {
  padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 18px; color: var(--text); cursor: pointer;
}
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); display: none; z-index: 999;
}

/* --- 顶部菜单按钮 --- */
.menu-btn {
  position: fixed; top: 20px; left: 20px; z-index: 1001;
  background: var(--s2); width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}

/* --- 页面容器 --- */
.page { display: none; padding: 80px 20px 20px; }
.page.active { display: block; }

/* 你的原有课程表样式 (简化展示，保留核心) */
.card { background: var(--s1); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
.active-tab-btn { background: var(--blue) !important; }

/* 识别状态提示 */
#loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-item" onclick="showPage('main')">📅 课程主页</div>
    <div class="drawer-item" onclick="showPage('about')">ℹ️ 关于本站</div>
    <div class="drawer-item" onclick="showPage('admin')">⚙️ 管理员设置</div>
</div>

<div class="menu-btn" onclick="toggleDrawer()">☰</div>

<div id="page-main" class="page active">
    <h1 id="hdrDate">加载中...</h1>
    <div class="card">
        <h3>今日晚自习</h3>
        <p id="ev1">加载中...</p>
        <p id="ev2"></p>
    </div>
    <div class="card">
        <h3>三基测试</h3>
        <p id="sanjiVal">无</p>
    </div>
</div>

<div id="page-about" class="page">
    <h2>关于本站</h2>
    <div class="card">
        <p>这是贵阳八中高三(3)班的专属课程工具。</p>
        <p>采用 Gemini 2.0 免费识别技术。</p>
    </div>
</div>

<div id="page-admin" class="page">
    <h2>识别配置</h2>
    <div class="card">
        <input type="file" accept="image/*" onchange="parseImage(this)">
        <p style="font-size: 12px; color: #888; margin-top:10px;">上传课程表图片即可自动更新 KV</p>
    </div>
    <div id="loading">识别中，请稍候...</div>
</div>

<script>
// --- 路由逻辑 ---
function toggleDrawer() {
    const d = document.getElementById('drawer');
    const o = document.getElementById('overlay');
    d.classList.toggle('open');
    o.style.display = d.classList.contains('open') ? 'block' : 'none';
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    toggleDrawer();
}

// --- Gemini 识别逻辑 ---
async function parseImage(input) {
    if(!input.files[0]) return;
    const file = input.files[0];
    document.getElementById('loading').style.display = 'block';

    const reader = new FileReader();
    reader.onload = async (e) => {
        const base64Data = e.target.result.split(',')[1];
        const payload = {
            contents: [{
                parts: [
                    { text: "请识别图片中的课程表/晚自习安排，并返回如下JSON格式: {S:[[周一课表],[周二]...], EV:{'日期':[安排1,安排2]}, SJ:{'日期':'科目'}}" },
                    { inline_data: { mime_type: file.type, data: base64Data } }
                ]
            }],
            generationConfig: { response_mime_type: "application/json" }
        };

        try {
            const resp = await fetch('/api/proxy-gemini', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await resp.json();
            const text = result.candidates[0].content.parts[0].text;
            
            // 保存到 KV
            await fetch('/api/data', { method: 'POST', body: text });
            alert('更新成功！刷新页面查看');
            location.reload();
        } catch (err) {
            alert('识别失败: ' + err.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    };
    reader.readAsDataURL(file);
}

// --- 初始化数据 (原逻辑) ---
async function init() {
    const resp = await fetch('/api/data');
    const data = await resp.json();
    // 这里根据你的 KV 数据结构更新 UI (hdrDate, ev1 等)
    // 示例：
    document.getElementById('hdrDate').textContent = new Date().toLocaleDateString();
    document.getElementById('ev1').textContent = data.EV ? "已加载数据" : "暂无安排";
}

init();
</script>
</body>
</html>
