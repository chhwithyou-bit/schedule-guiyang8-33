<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>贵阳八中高三(3)班课程表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --s3: #3a3a3c;
  --border: rgba(255,255,255,0.1);
  --blue: #0a84ff;
  --purple: #bf5af2;
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --text: #fff;
  --t2: rgba(255,255,255,0.55);
  --t3: rgba(255,255,255,0.28);
  --r: 13px;
}
html,body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system,'SF Pro Display','PingFang SC',sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.safe-top { height: env(safe-area-inset-top,44px); }
.header { padding: 6px 20px 14px; display:flex; align-items:flex-start; justify-content:space-between; }
.header-left {}
.hdr-school { font-size:13px; color:var(--t2); margin-bottom:1px; }
.hdr-title { font-size:34px; font-weight:700; letter-spacing:-0.5px; line-height:1.1; }
.hdr-date { font-size:15px; color:var(--t2); margin-top:3px; }
.admin-btn { background:var(--s2); border:none; color:var(--t2); font-size:12px; padding:6px 11px; border-radius:20px; cursor:pointer; margin-top:8px; font-family:inherit; }
.admin-btn:active { opacity:.7; }

/* cards */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 16px 11px; }
.card { background:var(--s1); border-radius:var(--r); padding:14px 15px; }
.c-icon { width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px; }
.c-icon.purple{background:rgba(191,90,242,.18);}
.c-icon.green{background:rgba(48,209,88,.18);}
.c-label { font-size:12px;color:var(--t2);margin-bottom:2px;font-weight:500; }
.c-val { font-size:17px;font-weight:700;line-height:1.2; }
.c-sub { font-size:11px;color:var(--t2);margin-top:3px; }

/* evening card */
.ev-wrap { padding:0 16px 11px; }
.ev-card { background:var(--s1); border-radius:var(--r); padding:14px 15px; }
.ev-head { display:flex;align-items:center;gap:8px;margin-bottom:11px; }
.ev-icon { width:28px;height:28px;border-radius:7px;background:rgba(10,132,255,.18);display:flex;align-items:center;justify-content:center;font-size:15px; }
.ev-title { font-size:15px;font-weight:600; }
.ev-slots { display:grid;grid-template-columns:1fr 1fr;gap:9px; }
.ev-slot { background:var(--s2);border-radius:10px;padding:10px 12px; }
.ev-slabel { font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:500; }
.ev-teacher { font-size:17px;font-weight:700; }
.ev-time { font-size:11px;color:var(--blue);margin-top:3px;font-weight:500; }

/* segmented control */
.seg-wrap { padding:0 16px 6px;position:sticky;top:0;z-index:100;background:var(--bg);padding-top:8px; }
.seg { display:flex;background:var(--s2);border-radius:9px;padding:2px;gap:2px; }
.seg-btn {
  flex:1;text-align:center;padding:6px 2px;border-radius:7px;
  font-size:14px;font-weight:500;color:var(--t2);cursor:pointer;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);user-select:none;-webkit-user-select:none;
  position:relative;
}
.seg-btn.active { background:var(--s1);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.45); }
.seg-btn.today-dot::after {
  content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--blue);
}

/* day views */
.day-view { display:none;padding:4px 16px 48px;animation:fu .22s ease; }
.day-view.active { display:block; }
@keyframes fu { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }

.sec-title { font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.5px;text-transform:uppercase;margin:16px 4px 8px; }
.plist { background:var(--s1);border-radius:var(--r);overflow:hidden; }
.prow { display:flex;align-items:center;padding:12px 16px;gap:13px;position:relative; }
.prow+.prow::before { content:'';position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--border); }
.pdot { width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0; }
.dm{background:rgba(255,159,10,.16);color:var(--orange);}
.da{background:rgba(10,132,255,.16);color:var(--blue);}
.ds{background:rgba(191,90,242,.16);color:var(--purple);}
.pmain { flex:1;min-width:0; }
.psubj { font-size:16px;font-weight:600;letter-spacing:-.2px; }
.psubj.sp { color:var(--purple); }
.pteacher { font-size:13px;color:var(--t2);margin-top:1px; }
.ptime { font-size:12px;color:var(--t3);flex-shrink:0; }
.break-pill { display:flex;align-items:center;justify-content:center;padding:7px 0 5px;color:var(--t3);font-size:12px;letter-spacing:1px; }

.footer { text-align:center;padding:6px 20px 32px;font-size:12px;color:var(--t3);line-height:1.8; }

/* ===== ADMIN MODAL ===== */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:1000; overflow-y:auto; backdrop-filter:blur(8px);
}
.modal-overlay.open { display:flex; flex-direction:column; }
.modal {
  background:var(--s1); border-radius:20px; margin:20px 16px;
  padding:20px; flex-shrink:0;
}
.modal-title { font-size:20px; font-weight:700; margin-bottom:4px; }
.modal-sub { font-size:13px; color:var(--t2); margin-bottom:20px; }

.field-label { font-size:13px; color:var(--t2); font-weight:500; margin-bottom:6px; margin-top:14px; }
.inp {
  width:100%; background:var(--s2); border:1px solid var(--border);
  border-radius:10px; padding:11px 13px; color:var(--text);
  font-size:15px; font-family:inherit; outline:none;
}
.inp:focus { border-color:var(--blue); }
.inp::placeholder { color:var(--t3); }

.upload-section { margin-top:14px; }
.upload-tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.utab {
  padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500;
  background:var(--s2); color:var(--t2); cursor:pointer; border:1px solid transparent;
  font-family:inherit;
}
.utab.active { background:rgba(10,132,255,.2); color:var(--blue); border-color:rgba(10,132,255,.4); }

.upload-area {
  border:1.5px dashed var(--s3); border-radius:12px; padding:24px 16px;
  text-align:center; cursor:pointer; transition:border-color .2s;
  position:relative; overflow:hidden;
}
.upload-area:hover, .upload-area.drag { border-color:var(--blue); }
.upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.upload-icon { font-size:32px; margin-bottom:8px; }
.upload-hint { font-size:13px; color:var(--t2); }
.upload-hint small { font-size:11px; color:var(--t3); display:block; margin-top:3px; }

.preview-img { width:100%; border-radius:10px; margin-top:10px; max-height:200px; object-fit:contain; display:none; }

.parse-btn {
  width:100%; padding:14px; border-radius:12px; border:none;
  background:var(--blue); color:#fff; font-size:16px; font-weight:600;
  font-family:inherit; cursor:pointer; margin-top:16px; transition:opacity .2s;
}
.parse-btn:disabled { opacity:.5; cursor:not-allowed; }
.parse-btn.loading { opacity:.7; }

.status-box {
  background:var(--s2); border-radius:10px; padding:12px 14px;
  margin-top:12px; font-size:13px; color:var(--t2); line-height:1.6;
  display:none; max-height:180px; overflow-y:auto;
}
.status-box.show { display:block; }
.status-ok { color:var(--green); }
.status-err { color:var(--red); }

.preview-section { display:none; margin-top:16px; }
.preview-section.show { display:block; }
.preview-title { font-size:15px; font-weight:600; margin-bottom:10px; }
.preview-json {
  background:var(--s2); border-radius:10px; padding:12px;
  font-size:11px; color:var(--t2); font-family:monospace;
  max-height:220px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
}
.action-row { display:flex; gap:10px; margin-top:12px; }
.btn-confirm {
  flex:1; padding:13px; border-radius:12px; border:none;
  background:var(--green); color:#fff; font-size:15px; font-weight:600;
  font-family:inherit; cursor:pointer;
}
.btn-cancel {
  padding:13px 20px; border-radius:12px; border:none;
  background:var(--s2); color:var(--t2); font-size:15px; font-weight:600;
  font-family:inherit; cursor:pointer;
}
.close-modal {
  float:right; background:var(--s2); border:none; color:var(--t2);
  width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.sync-indicator { font-size:11px; color:var(--t3); text-align:center; padding:4px 0 2px; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="header">
  <div class="header-left">
    <div class="hdr-school">贵阳八中</div>
    <div class="hdr-title">高三（3）班</div>

<!-- ===== ADMIN MODAL ===== -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <button class="close-modal" onclick="closeAdmin()">×</button>
    <div class="modal-title">📋 更新课表数据</div>
    <div class="modal-sub">上传图片，AI 自动识别并更新对应数据</div>



    <div class="upload-section">
      <div class="field-label">📸 选择要更新的表格类型</div>
      <div class="upload-tabs">
        <button class="utab active" onclick="setTab('sj')" id="tab-sj">📝 三基测试表</button>

      <div class="upload-area" id="uploadArea">

        <div class="upload-icon">📷</div>
        <div class="upload-hint">
          点击或拖拽上传图片
          <small>支持 JPG / PNG / HEIC</small>
        </div>
      </div>
      <img class="preview-img" id="previewImg">
    </div>

    <button class="parse-btn" id="parseBtn" onclick="parseImage()" disabled>🔍 识别图片内容</button>

    <div class="status-box" id="statusBox"></div>

    <div class="preview-section" id="previewSection">
      <div class="preview-title">📋 识别结果预览（确认后保存）</div>
      <div class="preview-json" id="previewJson"></div>
      <div class="action-row">
        <button class="btn-cancel" onclick="cancelPreview()">✕ 重来</button>
        <button class="btn-confirm" onclick="confirmSave()">✓ 确认保存到 Gist</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== DEFAULT DATA ====================
const DEFAULT_S=[
  [{s:'化学',t:'孙文军',k:'m'},{s:'生物',t:'白永乾',k:'m'},{s:'数学',t:'严云春',k:'m'},null,{s:'语文',t:'王诗雨',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'体育与健康',t:'孙卫理',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'班会/团组织生活',t:'',k:'x'}],
  [{s:'数学',t:'严云春',k:'m'},{s:'外语',t:'李姜苇',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'化学',t:'孙文军',k:'m'},{s:'化学',t:'孙文军',k:'m'},null,{s:'生物',t:'白永乾',k:'a'},{s:'语文',t:'王诗雨',k:'a'},{s:'语文',t:'王诗雨',k:'a'},{s:'物理',t:'陈科仲',k:'a'}],
  [{s:'外语',t:'李姜苇',k:'m'},{s:'物理',t:'陈科仲',k:'m'},{s:'生物',t:'白永乾',k:'m'},null,{s:'数学',t:'严云春',k:'m'},{s:'化学',t:'孙文军',k:'m'},null,{s:'语文',t:'王诗雨',k:'a'},{s:'周考/心理健康',t:'',k:'x'},{s:'周考/心理健康',t:'',k:'x'},{s:'周考/心理健康',t:'',k:'x'}],
  [{s:'物理',t:'陈科仲',k:'m'},{s:'数学',t:'严云春',k:'m'},{s:'数学',t:'严云春',k:'m'},null,{s:'化学',t:'孙文军',k:'m'},{s:'语文',t:'王诗雨',k:'m'},null,{s:'体育与健康',t:'孙卫理',k:'a'},{s:'生物',t:'白永乾',k:'a'},{s:'外语',t:'李姜苇',k:'a'},{s:'外语',t:'李姜苇',k:'a'}],
  [{s:'生物',t:'白永乾',k:'m'},{s:'生物',t:'白永乾',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'语文',t:'王诗雨',k:'m'},{s:'语文',t:'王诗雨',k:'m'},null,{s:'物理',t:'陈科仲',k:'a'},{s:'化学',t:'孙文军',k:'a'},{s:'数学',t:'严云春',k:'a'},{s:'数学',t:'严云春',k:'a'}],
  [{s:'语文',t:'王诗雨',k:'m'},{s:'数学',t:'严云春',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'周考2',t:'',k:'x'},{s:'周考2',t:'',k:'x'},null,{s:'生物',t:'白永乾',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'化学',t:'孙文军',k:'a'},{s:'—',t:'',k:'a'}],
];
const DEFAULT_EV={'2026-02-23':['龙安凤','吴斌'],'2026-02-24':['陈科仲','—'],'2026-02-25':['白永乾','—'],'2026-02-26':['孙文军','许官月'],'2026-02-27':['李姜苇','荀晓琳'],'2026-03-02':['王诗雨','王诗雨'],'2026-03-03':['严云春','廖春水'],'2026-03-04':['陈科仲','罩志涛'],'2026-03-05':['白永乾','—'],'2026-03-09':['孙文军','华娉'],'2026-03-10':['李姜苇','温泉'],'2026-03-11':['王诗雨','严云春'],'2026-03-12':['严云春','荀晓琳'],'2026-03-16':['陈科仲','张熙'],'2026-03-17':['白永乾','陈天野'],'2026-03-18':['孙文军','罩志涛'],'2026-03-19':['李姜苇','李姜苇'],'2026-03-20':['王诗雨','王诗雨'],'2026-03-23':['严云春','华娉'],'2026-03-24':['陈科仲','朱江培'],'2026-03-25':['白永乾','张捷'],'2026-03-26':['孙文军','戴斌'],'2026-03-27':['李姜苇','廖春水'],'2026-03-28':['龙安凤','吴斌']};
const DEFAULT_SJ={'2026-03-02':'选考科目1','2026-03-03':'语文','2026-03-05':'外语','2026-03-09':'物理/历史','2026-03-10':'听力','2026-03-11':'语文','2026-03-13':'数学','2026-03-16':'选考科目1','2026-03-17':'语文','2026-03-19':'外语','2026-03-20':'综合（取消）','2026-03-21':'物理/历史','2026-03-23':'物理/历史','2026-03-24':'听力','2026-03-25':'外语','2026-03-26':'数学','2026-03-27':'选考科目2','2026-03-28':'周考暂停统一加课','2026-03-30':'联考（智定）','2026-04-02':'选考科目2','2026-04-03':'外语'};

const TM=['7:40~8:20','8:30~9:10','9:20~10:00',null,'10:30~11:15','11:25~12:05',null,'2:00~2:40','2:50~3:30','3:40~4:25','4:35~5:15'];
const NM=[1,2,3,null,4,5,null,6,7,8,9];

// ==================== LIVE DATA (overridable) ====================
let S, EV, SJ;

// ==================== KV API SYNC ====================
const ANTHROPIC_KEY = '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';

function loadCredentials() {}
function saveCredentials() {}

async function loadFromKV(silent=false) {
  try {
    if(!silent) document.getElementById('syncIndicator').textContent = '正在同步数据…';
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error();
    const content = await res.json();
    S = content.S || DEFAULT_S;
    EV = content.EV || DEFAULT_EV;
    SJ = content.SJ || DEFAULT_SJ;
    document.getElementById('syncIndicator').textContent = '✓ 已同步 · ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    if(!S) { S = DEFAULT_S; EV = DEFAULT_EV; SJ = DEFAULT_SJ; }
    document.getElementById('syncIndicator').textContent = '⚠ 使用本地默认数据';
  }
}

async function refreshData() {
  await loadFromKV(true);
  document.getElementById('content').innerHTML = '';
  build();
  updateToday();
}

async function saveToKV(newData) {
  const res = await fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(newData)
  });
  if (!res.ok) throw new Error('保存失败');
}

// ==================== ADMIN UI ====================
let currentTab = 'sj';
let currentFile = null;
let parsedData = null;

function openAdmin() {
  loadCredentials();
  document.getElementById('adminModal').classList.add('open');
}
function closeAdmin() {
  document.getElementById('adminModal').classList.remove('open');
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.utab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  resetUpload();
}

function resetUpload() {
  currentFile = null;
  parsedData = null;
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('previewImg').src = '';
  document.getElementById('parseBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box';
  document.getElementById('previewSection').className = 'preview-section';
  document.getElementById('fileInput').value = '';
}

function cancelPreview() {
  parsedData = null;
  document.getElementById('previewSection').className = 'preview-section';
  document.getElementById('statusBox').className = 'status-box';
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('previewImg');
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
  document.getElementById('parseBtn').disabled = false;
}

// drag support
const ua = document.getElementById('uploadArea');
ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag'); });
ua.addEventListener('dragleave', () => ua.classList.remove('drag'));
ua.addEventListener('drop', e => {
  e.preventDefault(); ua.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) { currentFile = file; handleFile({ target: { files: [file] } }); }
});

function setStatus(msg, type='') {
  const b = document.getElementById('statusBox');
  b.className = 'status-box show';
  b.innerHTML = `<span class="status-${type}">${msg}</span>`;
}

async function parseImage() {
  if (!currentFile) { setStatus('请先选择图片', 'err'); return; }

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ 识别中…';
  setStatus('正在上传图片并识别，请稍候…');

  try {
    // Convert to base64
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(currentFile);
    });
    const mediaType = currentFile.type || 'image/jpeg';

    const prompts = {
      sj: `这是一张高中三基测试安排表，请识别表格中高三年级（高三年级/高三三年级/高三班）的三基测试安排。
请以 JSON 格式输出，格式为：{"SJ": {"YYYY-MM-DD": "科目名称", ...}}
日期格式必须为 YYYY-MM-DD（如 2026-03-02）。
只输出 JSON，不要任何其他文字。`,
      ev: `这是贵阳八中2025-2026学年第二学期高三年级晚自习课表，请识别高三(3)班的晚自习安排。
一段晚自习时间18:30-20:30，二段晚自习时间20:50-22:00。
请以 JSON 格式输出，格式为：{"EV": {"YYYY-MM-DD": ["一段老师姓名", "二段老师姓名"], ...}}
如果某天没有晚自习（周末等），不要包含该日期。
日期格式必须为 YYYY-MM-DD（如 2026-03-02）。
只输出 JSON，不要任何其他文字。`,
      sc: `这是贵阳八中高三(3)班课程表，请识别完整课程安排。
课程表格式：每天11个时间槽（含课间休息）：
时间槽索引0-10对应：第1节、第2节、第3节、课间操、第4节、第5节、午休、第6节、第7节、第8节、第9节
每节课有科目和教师。课间操和午休填 null。
星期一到星期六，共6天。
请以 JSON 格式输出：{"S": [[{s:"科目",t:"老师",k:"m或a或x"}, null, ...], ...]}
k值规则：上午课填"m"，下午课填"a"，考试/班会等特殊课填"x"，课间/午休填 null。
只输出 JSON，不要任何其他文字。`
    };

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 4096,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
            { type: 'text', text: prompts[currentTab] }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `API错误 ${response.status}`);
    }

    const result = await response.json();
    const text = result.content.map(c => c.text||'').join('');

    // Extract JSON
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AI 未返回有效 JSON，请重试');
    parsedData = JSON.parse(jsonMatch[0]);

    document.getElementById('previewJson').textContent = JSON.stringify(parsedData, null, 2);
    document.getElementById('previewSection').className = 'preview-section show';
    setStatus('✓ 识别成功！请检查下方结果，确认无误后点击保存。', 'ok');

  } catch(e) {
    setStatus('❌ 识别失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = '🔍 识别图片内容';
  }
}

async function confirmSave() {
  if (!parsedData) return;
  const btn = document.querySelector('.btn-confirm');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    saveCredentials();
    const current = { S: S||DEFAULT_S, EV: EV||DEFAULT_EV, SJ: SJ||DEFAULT_SJ };
    if (parsedData.SJ) current.SJ = { ...current.SJ, ...parsedData.SJ };
    if (parsedData.EV) current.EV = { ...current.EV, ...parsedData.EV };
    if (parsedData.S) current.S = parsedData.S;

    await saveToKV(current);
    S = current.S; EV = current.EV; SJ = current.SJ;

    document.getElementById('content').innerHTML = '';
    build();
    updateToday();
    setStatus(`✅ 已保存！`, 'ok');
    document.getElementById('previewSection').className = 'preview-section';
    setTimeout(closeAdmin, 1500);
  } catch(e) {
    setStatus('❌ 保存失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ 确认保存到 Gist';
  }
}

// ==================== SCHEDULE BUILD ====================
function build(){
  const c=document.getElementById('content');
  S.forEach(day=>{
    const div=document.createElement('div');
    div.className='day-view';
    let mp=[],ap=[];
    day.forEach((p,i)=>{
      if(!p)return;
      const n=NM[i];
      if(n&&n<=5)mp.push({p,i});
      else if(n&&n>=6)ap.push({p,i});
    });
    let h='';
    if(mp.length){
      h+='<div class="sec-title">上午</div><div class="plist">';
      mp.forEach(({p,i})=>{
        const dc=p.k==='x'?'ds':'dm';
        const sc=p.k==='x'?'psubj sp':'psubj';
        h+=`<div class="prow"><div class="pdot ${dc}">${NM[i]}</div><div class="pmain"><div class="${sc}">${p.s||'—'}</div>${p.t?`<div class="pteacher">${p.t}</div>`:''}</div><div class="ptime">${TM[i]||''}</div></div>`;
      });
      h+='</div>';
    }
    h+='<div class="break-pill">· · ·</div>';
    if(ap.length){
      h+='<div class="sec-title">下午</div><div class="plist">';
      ap.forEach(({p,i})=>{
        const dc=p.k==='x'?'ds':'da';
        const sc=p.k==='x'?'psubj sp':'psubj';
        h+=`<div class="prow"><div class="pdot ${dc}">${NM[i]}</div><div class="pmain"><div class="${sc}">${p.s||'—'}</div>${p.t?`<div class="pteacher">${p.t}</div>`:''}</div><div class="ptime">${TM[i]||''}</div></div>`;
      });
      h+='</div>';
    }
    div.innerHTML=h;
    c.appendChild(div);
  });
}

function pad(n){return String(n).padStart(2,'0');}

function updateToday(){
  const now=new Date();
  const y=now.getFullYear(),m=pad(now.getMonth()+1),d=pad(now.getDate());
  const k=`${y}-${m}-${d}`;
  const wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  document.getElementById('hdrDate').textContent=`${m}月${d}日  ${wd}`;
  const ev=EV[k];
  const wknd=now.getDay()===0||now.getDay()===6;
  document.getElementById('ev1').textContent=ev?ev[0]:(wknd?'无晚自习':'暂无安排');
  document.getElementById('ev2').textContent=ev?ev[1]:(wknd?'无晚自习':'暂无安排');
  const sj=SJ[k];
  document.getElementById('sanjiVal').textContent=sj||'今日无';
  document.getElementById('sanjiSub').textContent=sj?'三基测试':'';
}

function sw(i){
  document.querySelectorAll('.seg-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.day-view').forEach((d,j)=>d.classList.toggle('active',j===i));
}

// ==================== INIT ====================
async function init() {
  await loadFromKV();
  build();
  updateToday();
  const td=new Date().getDay();
  const ti=(td>=1&&td<=6)?td-1:0;
  sw(ti);
  document.querySelectorAll('.seg-btn')[ti]?.classList.add('today-dot');

  // Auto-refresh every 5 minutes
  setInterval(refreshData, 5 * 60 * 1000);
  // Refresh when phone screen wakes up
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshData();
  });
}

init();
</script>
