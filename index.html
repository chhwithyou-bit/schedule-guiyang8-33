<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高三(3)班">
<title>贵阳八中高三(3)班课程表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --s3: #3a3a3c;
  --border: rgba(255,255,255,0.1);
  --blue: #0a84ff;
  --purple: #bf5af2;
  --green: #30d158;
  --orange: #ff9f0a;
  --text: #fff;
  --t2: rgba(255,255,255,0.55);
  --t3: rgba(255,255,255,0.28);
  --r: 13px;
}
html,body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system,'SF Pro Display','PingFang SC',sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.safe-top { height: env(safe-area-inset-top,44px); }
.header { padding: 6px 20px 14px; }
.hdr-school { font-size:13px; color:var(--t2); margin-bottom:1px; }
.hdr-title { font-size:34px; font-weight:700; letter-spacing:-0.5px; line-height:1.1; }
.hdr-date { font-size:15px; color:var(--t2); margin-top:3px; }

/* cards */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 16px 11px; }
.card { background:var(--s1); border-radius:var(--r); padding:14px 15px; }
.c-icon { width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px; }
.c-icon.purple{background:rgba(191,90,242,.18);}
.c-icon.green{background:rgba(48,209,88,.18);}
.c-label { font-size:12px;color:var(--t2);margin-bottom:2px;font-weight:500; }
.c-val { font-size:17px;font-weight:700;line-height:1.2; }
.c-sub { font-size:11px;color:var(--t2);margin-top:3px; }

/* evening card */
.ev-wrap { padding:0 16px 11px; }
.ev-card { background:var(--s1); border-radius:var(--r); padding:14px 15px; }
.ev-head { display:flex;align-items:center;gap:8px;margin-bottom:11px; }
.ev-icon { width:28px;height:28px;border-radius:7px;background:rgba(10,132,255,.18);display:flex;align-items:center;justify-content:center;font-size:15px; }
.ev-title { font-size:15px;font-weight:600; }
.ev-slots { display:grid;grid-template-columns:1fr 1fr;gap:9px; }
.ev-slot { background:var(--s2);border-radius:10px;padding:10px 12px; }
.ev-slabel { font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:500; }
.ev-teacher { font-size:17px;font-weight:700; }
.ev-time { font-size:11px;color:var(--blue);margin-top:3px;font-weight:500; }

/* segmented control */
.seg-wrap { padding:0 16px 6px;position:sticky;top:0;z-index:100;background:var(--bg);padding-top:8px; }
.seg { display:flex;background:var(--s2);border-radius:9px;padding:2px;gap:2px; }
.seg-btn {
  flex:1;text-align:center;padding:6px 2px;border-radius:7px;
  font-size:14px;font-weight:500;color:var(--t2);cursor:pointer;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);user-select:none;-webkit-user-select:none;
  position:relative;
}
.seg-btn.active { background:var(--s1);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.45); }
.seg-btn.today-dot::after {
  content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--blue);
}

/* day views */
.day-view { display:none;padding:4px 16px 48px;animation:fu .22s ease; }
.day-view.active { display:block; }
@keyframes fu { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }

.sec-title { font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.5px;text-transform:uppercase;margin:16px 4px 8px; }
.plist { background:var(--s1);border-radius:var(--r);overflow:hidden; }
.prow { display:flex;align-items:center;padding:12px 16px;gap:13px;position:relative; }
.prow+.prow::before { content:'';position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--border); }
.pdot { width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0; }
.dm{background:rgba(255,159,10,.16);color:var(--orange);}
.da{background:rgba(10,132,255,.16);color:var(--blue);}
.ds{background:rgba(191,90,242,.16);color:var(--purple);}
.pmain { flex:1;min-width:0; }
.psubj { font-size:16px;font-weight:600;letter-spacing:-.2px; }
.psubj.sp { color:var(--purple); }
.pteacher { font-size:13px;color:var(--t2);margin-top:1px; }
.ptime { font-size:12px;color:var(--t3);flex-shrink:0; }
.break-pill { display:flex;align-items:center;justify-content:center;padding:7px 0 5px;color:var(--t3);font-size:12px;letter-spacing:1px; }

.footer { text-align:center;padding:6px 20px 32px;font-size:12px;color:var(--t3);line-height:1.8; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="header">
  <div class="hdr-school">贵阳八中</div>
  <div class="hdr-title">高三（3）班</div>
  <div class="hdr-date" id="hdrDate"></div>
</div>

<div class="cards">
  <div class="card">
    <div class="c-icon purple">📝</div>
    <div class="c-label">今日三基</div>
    <div class="c-val" id="sanjiVal">—</div>
    <div class="c-sub" id="sanjiSub"></div>
  </div>
  <div class="card">
    <div class="c-icon green">📅</div>
    <div class="c-label">学期时间</div>
    <div class="c-val" style="font-size:14px">至6月7日</div>
    <div class="c-sub">2025-2026第二学期</div>
  </div>
</div>

<div class="ev-wrap">
  <div class="ev-card">
    <div class="ev-head">
      <div class="ev-icon">🌙</div>
      <div class="ev-title">今晚晚自习</div>
    </div>
    <div class="ev-slots">
      <div class="ev-slot">
        <div class="ev-slabel">一段晚自习</div>
        <div class="ev-teacher" id="ev1">—</div>
        <div class="ev-time">18:30–20:30</div>
      </div>
      <div class="ev-slot">
        <div class="ev-slabel">二段晚自习</div>
        <div class="ev-teacher" id="ev2">—</div>
        <div class="ev-time">20:50–22:00</div>
      </div>
    </div>
  </div>
</div>

<div class="seg-wrap">
  <div class="seg">
    <div class="seg-btn" onclick="sw(0)">一</div>
    <div class="seg-btn" onclick="sw(1)">二</div>
    <div class="seg-btn" onclick="sw(2)">三</div>
    <div class="seg-btn" onclick="sw(3)">四</div>
    <div class="seg-btn" onclick="sw(4)">五</div>
    <div class="seg-btn" onclick="sw(5)">六</div>
  </div>
</div>

<div id="content"></div>
<div class="footer">心理健康教育每月一次 · 日语生上课地点：录播教室2</div>

<script>
const S=[
  [{s:'化学',t:'孙文军',k:'m'},{s:'生物',t:'白永乾',k:'m'},{s:'数学',t:'严云春',k:'m'},null,{s:'语文',t:'王诗雨',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'体育与健康',t:'孙卫理',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'班会/团组织生活',t:'',k:'x'}],
  [{s:'数学',t:'严云春',k:'m'},{s:'外语',t:'李姜苇',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'化学',t:'孙文军',k:'m'},{s:'化学',t:'孙文军',k:'m'},null,{s:'生物',t:'白永乾',k:'a'},{s:'语文',t:'王诗雨',k:'a'},{s:'语文',t:'王诗雨',k:'a'},{s:'物理',t:'陈科仲',k:'a'}],
  [{s:'外语',t:'李姜苇',k:'m'},{s:'物理',t:'陈科仲',k:'m'},{s:'生物',t:'白永乾',k:'m'},null,{s:'数学',t:'严云春',k:'m'},{s:'化学',t:'孙文军',k:'m'},null,{s:'语文',t:'王诗雨',k:'a'},{s:'周考/心理健康',t:'',k:'x'},{s:'周考/心理健康',t:'',k:'x'},{s:'周考/心理健康',t:'',k:'x'}],
  [{s:'物理',t:'陈科仲',k:'m'},{s:'数学',t:'严云春',k:'m'},{s:'数学',t:'严云春',k:'m'},null,{s:'化学',t:'孙文军',k:'m'},{s:'语文',t:'王诗雨',k:'m'},null,{s:'体育与健康',t:'孙卫理',k:'a'},{s:'生物',t:'白永乾',k:'a'},{s:'外语',t:'李姜苇',k:'a'},{s:'外语',t:'李姜苇',k:'a'}],
  [{s:'生物',t:'白永乾',k:'m'},{s:'生物',t:'白永乾',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'语文',t:'王诗雨',k:'m'},{s:'语文',t:'王诗雨',k:'m'},null,{s:'物理',t:'陈科仲',k:'a'},{s:'化学',t:'孙文军',k:'a'},{s:'数学',t:'严云春',k:'a'},{s:'数学',t:'严云春',k:'a'}],
  [{s:'语文',t:'王诗雨',k:'m'},{s:'数学',t:'严云春',k:'m'},{s:'外语',t:'李姜苇',k:'m'},null,{s:'周考2',t:'',k:'x'},{s:'周考2',t:'',k:'x'},null,{s:'生物',t:'白永乾',k:'a'},{s:'物理',t:'陈科仲',k:'a'},{s:'化学',t:'孙文军',k:'a'},{s:'—',t:'',k:'a'}],
];
const TM=['7:40~8:20','8:30~9:10','9:20~10:00',null,'10:30~11:15','11:25~12:05',null,'2:00~2:40','2:50~3:30','3:40~4:25','4:35~5:15'];
const NM=[1,2,3,null,4,5,null,6,7,8,9];
const EV={'2026-02-23':['龙安凤','吴斌'],'2026-02-24':['陈科仲','—'],'2026-02-25':['白永乾','—'],'2026-02-26':['孙文军','许官月'],'2026-02-27':['李姜苇','荀晓琳'],'2026-03-02':['王诗雨','王诗雨'],'2026-03-03':['严云春','廖春水'],'2026-03-04':['陈科仲','罩志涛'],'2026-03-05':['白永乾','—'],'2026-03-09':['孙文军','华娉'],'2026-03-10':['李姜苇','温泉'],'2026-03-11':['王诗雨','严云春'],'2026-03-12':['严云春','荀晓琳'],'2026-03-16':['陈科仲','张熙'],'2026-03-17':['白永乾','陈天野'],'2026-03-18':['孙文军','罩志涛'],'2026-03-19':['李姜苇','李姜苇'],'2026-03-20':['王诗雨','王诗雨'],'2026-03-23':['严云春','华娉'],'2026-03-24':['陈科仲','朱江培'],'2026-03-25':['白永乾','张捷'],'2026-03-26':['孙文军','戴斌'],'2026-03-27':['李姜苇','廖春水'],'2026-03-28':['龙安凤','吴斌']};
const SJ={'2026-03-02':'选考科目1','2026-03-03':'语文','2026-03-05':'外语','2026-03-09':'物理/历史','2026-03-10':'听力','2026-03-11':'语文','2026-03-13':'数学','2026-03-16':'选考科目1','2026-03-17':'语文','2026-03-19':'外语','2026-03-20':'综合（取消）','2026-03-21':'物理/历史','2026-03-23':'物理/历史','2026-03-24':'听力','2026-03-25':'外语','2026-03-26':'数学','2026-03-27':'选考科目2','2026-03-28':'周考暂停统一加课','2026-03-30':'联考（智定）','2026-04-02':'选考科目2','2026-04-03':'外语'};

function build(){
  const c=document.getElementById('content');
  S.forEach(day=>{
    const div=document.createElement('div');
    div.className='day-view';
    let mp=[],ap=[];
    day.forEach((p,i)=>{
      if(!p)return;
      const n=NM[i];
      if(n&&n<=5)mp.push({p,i});
      else if(n&&n>=6)ap.push({p,i});
    });
    let h='';
    if(mp.length){
      h+='<div class="sec-title">上午</div><div class="plist">';
      mp.forEach(({p,i})=>{
        const dc=p.k==='x'?'ds':'dm';
        const sc=p.k==='x'?'psubj sp':'psubj';
        h+=`<div class="prow"><div class="pdot ${dc}">${NM[i]}</div><div class="pmain"><div class="${sc}">${p.s||'—'}</div>${p.t?`<div class="pteacher">${p.t}</div>`:''}</div><div class="ptime">${TM[i]||''}</div></div>`;
      });
      h+='</div>';
    }
    h+='<div class="break-pill">· · ·</div>';
    if(ap.length){
      h+='<div class="sec-title">下午</div><div class="plist">';
      ap.forEach(({p,i})=>{
        const dc=p.k==='x'?'ds':'da';
        const sc=p.k==='x'?'psubj sp':'psubj';
        h+=`<div class="prow"><div class="pdot ${dc}">${NM[i]}</div><div class="pmain"><div class="${sc}">${p.s||'—'}</div>${p.t?`<div class="pteacher">${p.t}</div>`:''}</div><div class="ptime">${TM[i]||''}</div></div>`;
      });
      h+='</div>';
    }
    div.innerHTML=h;
    c.appendChild(div);
  });
}

function pad(n){return String(n).padStart(2,'0');}
function init(){
  const now=new Date();
  const y=now.getFullYear(),m=pad(now.getMonth()+1),d=pad(now.getDate());
  const k=`${y}-${m}-${d}`;
  const wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  document.getElementById('hdrDate').textContent=`${m}月${d}日  ${wd}`;
  const ev=EV[k];
  const wknd=now.getDay()===0||now.getDay()===6;
  document.getElementById('ev1').textContent=ev?ev[0]:(wknd?'无晚自习':'暂无安排');
  document.getElementById('ev2').textContent=ev?ev[1]:(wknd?'无晚自习':'暂无安排');
  const sj=SJ[k];
  document.getElementById('sanjiVal').textContent=sj||'今日无';
  document.getElementById('sanjiSub').textContent=sj?'三基测试':'';
}

function sw(i){
  document.querySelectorAll('.seg-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.day-view').forEach((d,j)=>d.classList.toggle('active',j===i));
}

build();init();
const td=new Date().getDay();
const ti=(td>=1&&td<=6)?td-1:0;
sw(ti);
document.querySelectorAll('.seg-btn')[ti]?.classList.add('today-dot');
</script>
</body>
</html>
