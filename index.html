<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.08);
    --accent: #f0c060;
    --accent2: #7eb8f7;
    --accent3: #a78bfa;
    --accent4: #6ee7b7;
    --text: #e8eaf0;
    --text-dim: #8892a4;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
    padding: 52px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(240,192,96,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .header-date {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Today card */
  .today-cards {
    padding: 14px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .info-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .info-card.weather::before { background: var(--accent2); }
  .info-card.evening::before { background: var(--accent3); }
  .info-card.sanji::before { background: var(--accent4); }

  .info-card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .info-card.weather .info-card-title { color: var(--accent2); }
  .info-card.evening .info-card-title { color: var(--accent3); }
  .info-card.sanji .info-card-title { color: var(--accent4); }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .weather-icon { font-size: 28px; }
  .weather-temp { font-size: 24px; font-weight: 700; color: var(--text); }
  .weather-desc { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

  .evening-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .evening-item {
    background: rgba(167,139,250,0.08);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .evening-label { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
  .evening-teacher { font-size: 14px; font-weight: 700; color: var(--text); }
  .evening-time { font-size: 10px; color: var(--accent3); margin-top: 1px; }

  .sanji-content {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
  }
  .sanji-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 14px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    margin-top: 14px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-dim);
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.2s;
    background: transparent;
  }
  .tab.active { color: var(--accent); background: var(--bg); border-color: var(--border); }
  .tab.today-tab { color: var(--accent4); }
  .tab.today-tab.active { color: var(--accent4); }

  /* Day view */
  .day-view { padding: 16px; display: none; animation: fadeIn 0.3s ease; }
  .day-view.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: var(--text-dim); margin: 20px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .section-label.morning { color: var(--accent); }
  .section-label.afternoon { color: var(--accent2); }

  .period-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .period-card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
  }
  .period-card.morning::before { background: var(--accent); }
  .period-card.afternoon::before { background: var(--accent2); }
  .period-card.special::before { background: var(--accent3); }

  .period-num {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .morning .period-num { background: rgba(240,192,96,0.15); color: var(--accent); }
  .afternoon .period-num { background: rgba(126,184,247,0.15); color: var(--accent2); }
  .special .period-num { background: rgba(167,139,250,0.15); color: var(--accent3); }

  .period-info { flex: 1; min-width: 0; }
  .period-time { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .period-subject { font-size: 17px; font-weight: 700; font-family: 'Noto Serif SC', serif; color: var(--text); }
  .period-teacher { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .period-card.special .period-subject { color: var(--accent3); font-size: 14px; }

  .break-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; color: var(--text-dim); font-size: 12px; letter-spacing: 1px;
  }
  .break-bar::before, .break-bar::after { content:''; flex:1; height:1px; background:var(--border); }

  .footer {
    text-align: center; padding: 24px 20px 40px;
    font-size: 11px; color: var(--text-dim); line-height: 1.8;
    border-top: 1px solid var(--border); margin-top: 8px;
  }
  .no-data { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>

// ============ WEATHER ============
async function fetchWeather() {
  try {
    const res = await fetch('https://wttr.in/Guiyang?format=j1');
    const data = await res.json();
    const cur = data.current_condition[0];
    const temp = cur.temp_C;
    const desc = cur.weatherDesc[0].value;
    const feels = cur.FeelsLikeC;
    const icons = {
      'Sunny':'☀️','Clear':'🌙','Partly cloudy':'⛅','Cloudy':'☁️',
      'Overcast':'☁️','Mist':'🌫','Fog':'🌫','Light rain':'🌧','Moderate rain':'🌧',
      'Heavy rain':'🌧','Light snow':'❄️','Blizzard':'❄️','Thundery outbreaks':'⛈',
      'Patchy rain possible':'🌦','Patchy snow possible':'🌨',
    };
    let icon = '🌡';
    for (const [k,v] of Object.entries(icons)) {
      if (desc.toLowerCase().includes(k.toLowerCase())) { icon = v; break; }
    }
    const descMap = {
      'Sunny':'晴','Clear':'晴','Partly cloudy':'多云','Cloudy':'阴','Overcast':'阴天',
      'Mist':'薄雾','Fog':'大雾','Light rain':'小雨','Moderate rain':'中雨','Heavy rain':'大雨',
      'Light snow':'小雪','Blizzard':'暴雪','Thundery outbreaks':'雷阵雨',
      'Patchy rain possible':'局部有雨','Patchy snow possible':'局部有雪',
    };
    let descZh = desc;
    for (const [k,v] of Object.entries(descMap)) {
      if (desc.toLowerCase().includes(k.toLowerCase())) { descZh = v; break; }
    }
    document.getElementById('weatherIcon').textContent = icon;
    document.getElementById('weatherTemp').textContent = temp + '°C';
    document.getElementById('weatherDesc').textContent = descZh + '  体感 ' + feels + '°C';
  } catch(e) {
    document.getElementById('weatherTemp').textContent = '获取失败';
    document.getElementById('weatherDesc').textContent = '请检查网络';
  }
}

// ============ DATE & TODAY INFO ============
function padZ(n) { return String(n).padStart(2,'0'); }

function updateTodayInfo() {
  const now = new Date();
  const y = now.getFullYear();
  const m = padZ(now.getMonth()+1);
  const d = padZ(now.getDate());
  const dateKey = `${y}-${m}-${d}`;
  const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  const wd = weekDays[now.getDay()];

  document.getElementById('headerDate').textContent = `${y}年${m}月${d}日  ${wd}`;

  // Evening
  const ev = eveningData[dateKey];
  if (ev) {
    document.getElementById('ev1Teacher').textContent = ev[0] || '—';
    document.getElementById('ev2Teacher').textContent = ev[1] || '—';
  } else {
    const isWeekend = now.getDay()===0||now.getDay()===6;
    document.getElementById('ev1Teacher').textContent = isWeekend ? '无晚自习' : '暂无数据';
    document.getElementById('ev2Teacher').textContent = isWeekend ? '无晚自习' : '暂无数据';
  }

  // Sanji
  const sanji = sanjiData[dateKey];
  if (sanji) {
    document.getElementById('sanjiContent').textContent = sanji;
    document.getElementById('sanjiSub').textContent = '高三年级三基测试';
  } else {
    document.getElementById('sanjiContent').textContent = '今日无三基测试';
    document.getElementById('sanjiSub').textContent = '';
  }
}

// ============ BUILD SCHEDULE ============
function buildSchedule() {
  const container = document.getElementById('content');
  schedule.forEach((day, di) => {
    const div = document.createElement('div');
    div.className = 'day-view';
    let morningShown = false, afternoonShown = false;
    let html = '';

    day.forEach((period, i) => {
      const num = periodNums[i];
      const time = times[i];

      if (period === null) {
        if (i===3) html += '<div class="break-bar">课间操</div>';
        else if (i===6) html += '<div class="break-bar">午 休</div>';
        return;
      }

      if (!morningShown && num && num<=5) {
        html += '<div class="section-label morning">🌤 上午</div>';
        morningShown = true;
      }
      if (!afternoonShown && num && num>=6) {
        html += '<div class="section-label afternoon">🌆 下午</div>';
        afternoonShown = true;
      }

      const cls = period.type;
      const subj = period.sub || '—';
      html += `<div class="period-card ${cls}">
        <div class="period-num">${num||''}</div>
        <div class="period-info">
          <div class="period-time">${time||''}</div>
          <div class="period-subject">${subj}</div>
          ${period.teacher ? `<div class="period-teacher">👤 ${period.teacher}</div>` : ''}
        </div>
      </div>`;
    });

    div.innerHTML = html;
    container.appendChild(div);
  });
}

function switchDay(idx) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.day-view').forEach((d,i)=>d.classList.toggle('active',i===idx));
}

if (todayJS>=1 && todayJS<=6) {
  switchDay(todayJS-1);
  document.querySelectorAll('.tab')[todayJS-1]?.scrollIntoView({inline:'center',behavior:'smooth'});
} else {
  switchDay(0);
}

// Mark today's tab
const todayTabIdx = new Date().getDay()-1;
if (todayTabIdx>=0 && todayTabIdx<6) {
  document.querySelectorAll('.tab')[todayTabIdx]?.classList.add('today-tab');
}
</script>
</body>
</html>
