<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8Community · 登录 / 注册 v0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0EEE6;--surface:#FAF9F5;--ink:#191919;--ink-soft:#6B6862;
    --clay:#CC785C;--clay-light:#D4A27F;--hairline:#E3DFD3;--hairline-strong:#D8D3C5;
    --sans:'Space Grotesk',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;
    --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:64px;
    --r-card:16px;--r-btn:8px;--ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);min-height:100vh;display:grid;place-items:center;padding:var(--s3)}
  ::selection{background:var(--clay-light);color:var(--ink)}

  /* 遮罩示意 */
  .scrim{position:fixed;inset:0;background:rgba(25,25,25,.18);backdrop-filter:blur(2px)}

  .modal{position:relative;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s5) var(--s4) var(--s4);box-shadow:0 24px 60px -24px rgba(25,25,25,.22)}

  .brand{font-family:var(--sans);font-weight:600;font-size:18px;text-align:center;margin-bottom:var(--s4)}
  .brand .slash{color:var(--clay)}

  .title{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.02em;text-align:center;margin-bottom:var(--s1)}
  .subtitle{font-family:var(--serif);font-size:16px;color:var(--ink-soft);text-align:center;margin-bottom:var(--s5)}

  /* 登录/注册切换 */
  .switch{display:flex;background:var(--paper);border:1px solid var(--hairline);border-radius:999px;padding:3px;margin-bottom:var(--s4)}
  .switch button{flex:1;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:none;border-radius:999px;padding:9px 0;cursor:pointer;transition:all .2s var(--ease)}
  .switch button[aria-selected="true"]{background:var(--clay);color:var(--paper)}

  .field{margin-bottom:var(--s3)}
  .field label{display:block;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:var(--s1)}
  .field input{width:100%;font-family:var(--serif);font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-btn);padding:12px 14px;transition:border-color .18s var(--ease)}
  .field input:focus{outline:none;border-color:var(--clay)}
  .field input::placeholder{color:var(--ink-soft);opacity:.6}

  .submit{width:100%;font-family:var(--sans);font-size:15px;font-weight:500;color:var(--paper);background:var(--clay);border:none;border-radius:var(--r-btn);padding:13px 0;cursor:pointer;margin-top:var(--s2);transition:background .18s var(--ease),transform .18s var(--ease)}
  .submit:hover{background:#b5664c;transform:translateY(-1px)}

  .foot-note{font-family:var(--serif);font-size:14px;color:var(--ink-soft);text-align:center;margin-top:var(--s4);line-height:1.7}
  .foot-note a{color:var(--clay);text-decoration:none}

  .close{position:absolute;top:var(--s3);right:var(--s3);width:30px;height:30px;border-radius:999px;border:1px solid var(--hairline);background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;transition:all .18s var(--ease)}
  .close:hover{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>
<div class="scrim"></div>

<div class="modal">
  <button class="close" aria-label="关闭">×</button>
  <div class="brand">8Community<span class="slash">/</span></div>

  <h1 class="title">回来了</h1>
  <p class="subtitle">一个安静的角落,等你说话。</p>

  <div class="switch">
    <button aria-selected="true">登录</button>
    <button aria-selected="false">注册</button>
  </div>

  <div class="field">
    <label for="u">用户名</label>
    <input id="u" type="text" placeholder="你的名字" />
  </div>
  <div class="field">
    <label for="p">密码</label>
    <input id="p" type="password" placeholder="••••••••" />
  </div>

  <button class="submit">登录 /</button>

  <p class="foot-note">还没有账号?<a href="#">现在注册</a></p>
</div>
</body>
</html>
