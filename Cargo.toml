[package]
name = "schedule-guiyang8-33"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4", "fast-rng", "js"] }
worker = { version = "0.7.5", features = ["d1"] }
getrandom = { version = "0.2.15", features = ["js"] }
regex = "1.11.1"
base64 = "0.22.1"
